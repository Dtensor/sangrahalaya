<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Yantra Sangrahalaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f1f0ec;--panel:#fbfaf7;--panel-2:#f4f2ed;--ink:#1c1d20;--muted:#5f636b;--line:#dcd9d1;
  --accent:#23457a;--accent-ink:#ffffff;--brass:#8c6a22;--glass:rgba(251,250,247,.88);--code:#eeece6;
  --ok:#1f8a4c;--warn:#a86d12;--bad:#b3261e;--idle:#6f747c;
  --shadow:0 18px 50px rgba(28,29,32,.16),0 2px 6px rgba(28,29,32,.08);
  --display:'Marcellus','Trajan Pro',Georgia,serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#121417;--panel:#1a1d22;--panel-2:#20242a;--ink:#ebe8e1;--muted:#a3a6ad;--line:#2f343b;
  --accent:#9dbbef;--accent-ink:#0e1a2e;--brass:#d6b25e;--glass:rgba(26,29,34,.9);--code:#23272e;
  --ok:#4cc27f;--warn:#e0a84a;--bad:#ef6a5f;--idle:#9aa0a8;--shadow:0 18px 50px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#121417;--panel:#1a1d22;--panel-2:#20242a;--ink:#ebe8e1;--muted:#a3a6ad;--line:#2f343b;
  --accent:#9dbbef;--accent-ink:#0e1a2e;--brass:#d6b25e;--glass:rgba(26,29,34,.9);--code:#23272e;
  --ok:#4cc27f;--warn:#e0a84a;--bad:#ef6a5f;--idle:#9aa0a8;--shadow:0 18px 50px rgba(0,0,0,.5)}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);height:100%;min-height:520px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:6}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0;flex-wrap:wrap}
.brand h1{margin:0;font:400 23px/1.1 var(--display);letter-spacing:.05em}
#meta{font:11.5px var(--mono);color:var(--muted)}
.halls{display:flex;gap:6px;overflow-x:auto;flex:1 1 380px;min-width:0;scrollbar-width:none;padding-block:2px}
.halls::-webkit-scrollbar{display:none}
.halls button{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;cursor:pointer;transition:border-color .2s,background .2s}
.halls button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.halls button em{font:11px var(--mono);color:var(--muted);font-style:normal}
.halls button:hover{border-color:var(--c)}
.halls button[aria-current="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--panel)}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{position:relative}
#q{width:210px;max-width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 10px}
.results{position:absolute;right:0;top:calc(100% + 6px);width:min(360px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:20;display:grid;gap:2px}
.results button{display:grid;grid-template-columns:10px 1fr;gap:2px 10px;align-items:center;text-align:left;border:0;background:none;padding:7px 8px;border-radius:7px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--panel-2)}
.results i{width:8px;height:8px;border-radius:50%;background:var(--c);grid-row:span 2}
.results b{font-weight:600}.results small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel-2);padding:6px 12px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sister{font-size:12.5px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.sister:hover{color:var(--ink)}
#stage{position:relative;overflow:hidden;min-height:0;background:#efece6}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}#gl.hot{cursor:pointer}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow)}
#where{position:absolute;left:16px;top:16px;padding:10px 14px 11px;border-radius:12px;max-width:min(340px,calc(100% - 32px));pointer-events:none;transition:opacity .35s}
#where small{display:block;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--brass))}
#where b{display:block;font:400 22px/1.2 var(--display);letter-spacing:.03em}
#where span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
#mini{position:absolute;left:16px;bottom:16px;width:176px;height:176px;border-radius:14px;cursor:crosshair}
#hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 14px;border-radius:999px;font-size:12.5px;color:var(--muted);white-space:nowrap;transition:opacity .6s;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#hint kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink);background:var(--panel)}
#pad{position:absolute;right:16px;bottom:16px;display:none;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:6px}
#pad button{border-radius:12px;border:1px solid var(--line);background:var(--glass);font-size:18px;touch-action:none;-webkit-user-select:none;user-select:none}
@media (pointer:coarse){#pad{display:grid}}
#tip{position:absolute;pointer-events:none;padding:6px 10px;border-radius:8px;background:rgba(20,21,24,.86);color:#f3efe6;font-size:12.5px;white-space:nowrap;transform:translate(14px,14px);z-index:3}
#tip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--c)}
#drawer{position:absolute;right:16px;top:16px;bottom:16px;width:min(410px,calc(100% - 32px));overflow:auto;border-radius:16px;padding:22px 22px 18px;z-index:4;animation:slide .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
#drawer .close{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.ey{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
#drawer h2{font:400 30px/1.15 var(--display);margin:6px 36px 10px 0;letter-spacing:.02em;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:7px;font:500 12px var(--sans);padding:3px 10px 3px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--s) 40%,transparent);color:var(--s);background:color-mix(in srgb,var(--s) 10%,transparent)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--s)}
.pill.live i{animation:beat 1.6s ease-in-out infinite}
@keyframes beat{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--s) 0%,transparent),0 0 0 2px color-mix(in srgb,var(--s) 35%,transparent)}}
.statenote{font-size:12px;color:var(--muted);margin:6px 0 0}
#drawer p.what{font-size:15px;line-height:1.55;margin:14px 0 16px;max-width:62ch}
.sec{margin-top:16px}
.sec h3{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.machine{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.machine .col{display:flex;flex-direction:column;gap:5px;min-width:0}
.machine .col.r{align-items:flex-end}
.machine .core{font:500 11px var(--mono);text-align:center;color:var(--c);padding:10px 8px;border-radius:50%;border:1.5px solid var(--c);width:76px;height:76px;display:grid;place-items:center;line-height:1.2}
.port{font:12px var(--mono);padding:2px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--p);max-width:100%;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
button.chip{cursor:pointer}button.chip:hover{border-color:var(--c)}
button.chip i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:6px}
.launch{display:grid;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.primary{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:9px 15px;font-weight:600;text-decoration:none;cursor:pointer}
.ghost{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-weight:500;text-decoration:none;cursor:pointer}
.ghost:hover{border-color:var(--ink)}
.cmd{font:12px/1.5 var(--mono);background:var(--code);border:1px solid var(--line);border-radius:9px;padding:10px 12px;overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;user-select:all}
.fine{font-size:12px;color:var(--muted);margin:0}
.walk{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
#veil{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9;transition:opacity .8s}
#veil h2{font:400 34px var(--display);letter-spacing:.08em;margin:0;text-align:center}
#veil p{text-align:center;color:var(--muted);font:12px var(--mono);letter-spacing:.1em;text-transform:uppercase}
#fade{position:absolute;inset:0;background:#f7f5f0;opacity:0;pointer-events:none;transition:opacity .24s ease;z-index:2}
#catalogue{position:absolute;inset:0;overflow:auto;background:var(--bg);z-index:5;padding:20px 16px 48px}
.cwrap{max-width:1200px;margin:0 auto}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chall{margin:28px 0 12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.chall h2{font:400 26px var(--display);margin:0;letter-spacing:.03em}
.chall h2::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:10px;vertical-align:.15em}
.chall span{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h4{margin:0;font:600 15px/1.3 var(--sans)}
.card .cat{font:10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card p{margin:0;font-size:13px;color:var(--muted);flex:1}
.card .btnrow button,.card .btnrow a{font-size:12.5px;padding:6px 11px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--s);flex:none;margin-top:5px}
.empty{color:var(--muted);padding:30px 0}
@media (max-width:700px){
  header{gap:8px 12px}
  .brand h1{font-size:20px}
  #q{width:150px}
  #drawer{left:0;right:0;top:auto;bottom:0;width:100%;max-height:64%;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));animation-name:rise}
  @keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
  #mini{width:118px;height:118px}
  #where b{font-size:18px}
  #hint{display:none}
}
@media (prefers-reduced-motion:reduce){#drawer{animation:none}.pill.live i{animation:none}#fade{transition:none}}
</style>

-stroll","aerial-route-flyover","virtual-travel","chase-drone-view","beach-walk-experience"],"with":["live-map","streetview-teleport"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"genui","name":"genui \u2014 Local Generative-UI Engine (ask for a screen, it builds itself)","hall":"daily","group":"Everyday & utilities","cat":"apps/generative-ui","what":"Ask for a phone-app-style SCREEN in natural language and it is generated live, streamed in piece by piece, and rendered as a light-theme HTML page. One component CONTRACT (contract.py) AUTO-GENERATES the LLM system prompt (drift-proof \u2014 the model can only ask for components that render), the model emits a compact per-line UI DSL, and ONE renderer (render.py) paints it (design system decoupled from contract). Local-first over fusion-shim :8051 (model auto), no cloud, no key, no mobile runtime. `serve` is simultaneously a fleet front-end and a client app layer \u2014 any device on the network opens :8831, needs none of the stack. Actions are simulated (like the appless demo it steals from).","mode":"On demand","kind":"cli","host":"This Mac","in":["natural-language-screen-request","optional-grounding-data-via-context-cmd"],"out":["light-theme-html-screen","live-streamed-web-app"],"can":["generate-ui-from-natural-language","live-streaming-screen-render","dashboard-on-demand","fleet-front-end-over-tools","client-facing-app-surface","contract-generated-prompt"],"with":["design","diagen","live-map"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"im-send","name":"im-send / im-read \u2014 local iMessage + SMS channel","hall":"daily","group":"Everyday & utilities","cat":"communication","what":"Sends iMessage/SMS through the Mac's already-signed-in Messages.app via AppleScript, and reads or tails the inbound stream straight out of the local chat.db. The stack's first INBOUND channel: tg-send, wa-send and fanout are senders only, so an agent could ity-ring state, deficits and a Burn Bar (today vs your own 30-day median). Jenny's meal-window ask ladder opens with what she can SEE instead of asking blind.\n","mode":"Service","kind":"cli","host":"This Mac","in":["iPhone Shortcut \"Jenny_Health_Day\" writing Jenny/<metric>.json"],"out":["health_samples rows in jenny.db + rings/deficits/burn_bar for Jenny's prompts"],"can":["read today's steps / active calories / exercise minutes / stand time from Apple Health","compute move / exercise / stand ring percentages and what is still open, ranked by gap","compare today against your own 30-day median (Burn Bar)","state honestly when the data is stale or missing rather than inventing a number","feed Jenny's meal-window openers so she leads with observation, not interrogation"],"with":["dr-jenny","iphone","bodyclock"],"cmd":"","url":"","state":"responding","stateLabel":"Responding","stateNote":""},{"id":"amrit","name":"Amrit (health_wellness)","hall":"daily","group":"Health & wellbeing","cat":"health wellness","what":"energy ledger \u2014 daily 1-10 energy log, computed (not LLM) 14/30-day trends + weekday patterns + SVG sparkline page; health questions hand off to biomed, never answered itself; educational only","mode":"On demand","kind":"cli","host":"This Mac","in":["see subcommands"],"out":["light HTML + state in a local folder (+ Telegram where specced)"],"can":["amrit","log my energy","energy trend","how has my energy been","am I running on empty"],"with":["biomed"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"biomed","name":"BioMed research (biomcp supercharge)","hall":"daily","group":"Health & wellbeing","cat":"health wellness","what":"Grounded biomedical Q&A, health-claim fact-check, cited evidence packs, and mechanism-figure specs over ~35 keyless read-only sources (PubMed, ClinicalTrials.gov, OpenFDA/FAERS, ClinVar/gnomAD, Reactome, OncoKB) via biomcp; composes factcheck+labbench+/design. Educational only, not medical advice.","mode":"On demand","kind":"bash","host":"This Mac","in":["health claim / biomedical question / gene symbol"],"out":["verdict + cited evidence (text/markdown/HTML)"],"can":["verify a health claim against literature + trials + drug safety (honest-bucketed verdict)","cited evidence pack for a biomedical question (+ labbench pre-registration stub)","grounded /design scientific-figure mechanism spec from a gene","entity-aware grounded biomedical Q&A","check ~35 source API health"],"with":["factcheck","labbench","design","honesty"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"maker-fleet","name":"maker-fleet","hall":"daily","group":"Everyday & utilities","cat":"local/uncensored/models","what":"Local uncensored model fleet, routed through /maker (maker-relay, auto-discovering \u2014 scans ollama /api/tags and regex-matches names, so new pulls appear automatically; no hardcoded map). Purpose-built TheDrummer/companion finetunes added 2026-06-28, all 128GB M4 Max, ollama :11434, each spot-checked generating cleanly. SPECIALISTS: valkyrie-49b (RP flagship, TheDrummer Valkyrie-49B Q8, long-form ambitious roleplay/narrative) \u00b7 magnum-72b (prose flagship, anthracite Magnum-v4-72B Q4_K_M, literary fiction, Claude-prose-distilled) \u00b7 cydonia-24b (fast RP daily-driver, TheDrummer Cydonia-24B Q6, sweet-spot creative) \u00b7 gemma-the-writer-9b (creative-prose craft, DavidAU Gemma-The-Writer Q6, fast) \u00b7 whiterabbitneo-7b (offensive-security / red-team dual-use, WhiteRabbitNeo-2.5-Qwen-Coder Q6 \u2014 authorized pentest/CTF only) \u00b7 qwen2.5-vl-uncensored (uncensored vision-language, Qwen2.5-VL-7B-abliterated Q6 + mmproj-f16, unrestricted image captioning/forensics). Complements the abliterated-general fleet (uncensored-gemma/qwen/hauhau) and Rocinante/DavidAU. Distinct from abliteration: these are TRAINED for RP/prose/security, not just refusal-removed. Gaps still open: Hindi/Indic uncensored, abliterated reasoning. Build gged \u2014 FillLedger.is_sound() fails the run otherwise. Cover letters and open-ended answers are drafted grounded in the resume, then self-linted for AI tells and repaired up to twice. Runs on browser-harness (the user's own logged-in Chrome) and fusion-shim :8051 \u2014 no Playwright MCP, no cloud key, no new service.","mode":"On demand","kind":"cli","host":"This Mac","in":["a job posting URL, plus a local folder and a registered resume"],"out":["a browser tab parked at Submit, a \ud83d\udd34 flag list, SQLite tracker a local folder"],"can":["read-only form scan showing the fill plan without touching the page (applykit scan <url>)","fit-gate a posting against the resume before anything else (applykit fit <url>)","fill one application and park it at Submit (applykit apply <url> --fill)","unattended batch over urls.txt, marking blocked rather than pausing (applykit batch)","grounded cover letter with a hallucination sniff (applykit cover <url> --out f.md)","pipeline board with response rate and 14-day stale detection (applykit board)","append-only answer memory, newest wins (applykit answers \"<q>\" / --add)","standalone AI-tell linter for any prose, exit 1 when it reads like a bot (applykit lint)"],"with":["browser-harness","huashu-proofreading","bidkit","smails","secondbrain"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"parley","name":"parley Meeting Copilot","hall":"daily","group":"Everyday & utilities","cat":"productivity","what":"Private local-first meeting/call notetaker + recall copilot (clean-room from the natively-cluely eval; NOT its non-commercial code). Dual-channel ffmpeg/avfoundation capture (system audio = THEM, mic = ME) -> mlx_whisper STT -> stdlib sqlite FTS5 memory -> fusion-shim :8051 for answers/minutes. Ask questions about a meeting, generate speaker-attributed minutes, add PDF/DOCX context, export to Obsidian/wiki, and build pre-interview PREP briefs. The interview-cheating undetectable/anti-detection layer is deliberately excluded. Everything stays local.","mode":"On demand","kind":"cli","host":"This Mac","in":["audio","meeting","pdf-docx-context"],"out":["transcript","minutes-markdown","answers"],"can":["meeting-transcription","live-transcription","meeting-notes","meeting-minutes","call-notetaker","ask-my-meeting","meeting-recall","interview-prep","transcribe-audio","speaker-attribution"],"with":["mlx_whisper","fusion-shim","freeintel","wiki-ingest"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"loop-observer","name":"loop_observer (in-loop free repairs)","hall":"daily","group":"Everyday & utilities","cat":"self improvement","what":"In-loop observer primitive: repair a loop step's malformed output for free (RETRY/REPLACE/STOP, no fresh model turn), count progress vs repair turns to expose thrash","mode":"Reference","kind":"library","host":"This Mac","in":["a step function (model/tool call) + observers that inspect its result"],"out":["an accepted result + LoopStats (progress_turns, repair_turns, repair_ratio)"],"can":["wrap a model/tool loop so malformed output is repaired IN PLACE without burning an iteration (RETRY/REPLACE/STOP)","separate progress_turns from repair_turns -> a repair_ratio that reveals a loop thrashing on its own output","back arena's repair-and-escalate, loopdoctor's thrash signal, and honesty.sap JSON recovery from one primitive"],"with":["arena (RETRY consumer \u2014 diff repair)","loopdoctor (reads the repair ratio)","honesty.sap_observer (REPLACE consumer \u2014 JSON recovery)"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"samadhan","name":"samadhan \u2014 Recursive Problem\u2192Product Engine","hall":"daily","group":"Everyday & utilities","cat":"self improvement","what":"samadhan: professor-grounded recursive problem\u2192product engine. Runs a problem through ground(faculty)\u2192prior-art(patents)\u2192conceive\u2192debate\u2192fault\u2192correct, RECURSING until the skeptic finds no fatal faults (or N cycles), then writes a journaled dossier. Every stage bucketed OK/DEGRADED/NOT_RUN; an ungrounded concept is auto-failed; 'converged' needs an explicit zero-faults signal. Composes faculty + patents + fusion-shim. Produces review dossiers, never auto-ships. Daemon: com.king.samadhan-daemon.","mode":"Service","kind":"cli","host":"This Mac","in":["text/plain"],"out":["text/markdown","json"],"can":["recursive-problem-solving","professor-grounded-conceive","adversarial-fault-correct-loop","prior-art-check","journaled-dossier-output"],"with":["faculty","patents","manthan","kalpataru","crucible","assay","gatekeep"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"vidwan","name":"Vidwan \u2014 House Analyst LoRA corpus forge","hall":"daily","group":"Everyday & utilities","cat":"self improvement","what":"Builds an instruction-tuning corpus that teaches the studio's METHOD (dossier structure, honesty buckets, [src:] citation discipline) from its own artifacts, then gates any resulting LoRA with a blind paired A/B on a sealed holdout.","mode":"On demand","kind":"cli","host":"This Mac","in":["a local folder + chetna corpus.db wiki_notes (Obsidian vault answers)"],"out":["a local folder + eval.jsonl + stats.json"],"can":["assemble train/eval JSONL from manthan dossiers + chetna vault answers","split at DOCUMENT level so eval cannot leak the style it tests","redact secret-shaped strings before anything is written","blind A/B a tuned model vs base with an exact binomial sign test"],"with":["manthan","chetna","gpubox","assay","labbench"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"acharya","name":"Acharya \u2014 Single-Point Skill Advisor","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Acharya: the estate's single-point skill ADVISOR over all ~700 capabilities. Takes any fuzzy or half-remembered reference ('what is defence innovator', 'that thing that watched my cameras') and answers from the LIVING catalogs at question time -- auto-invoke table, mem-recall, skill-index, localboss cards, tool READMEs, state dirs + PM2 for track record -- so it never goes stale. Answer contract: what it is and why, practical commands, what it includes/automates, what it has DONE (Verified/Believed/Not-checked bucketed), suggestive next steps. Read-only by doctrine.","mode":"On demand","kind":"cli","host":"This Mac","in":["text"],"out":["text/markdown"],"can":["skill-identity-lookup","fuzzy-capability-resolution","practical-usage-guidance","track-record-evidence","consolidator-map"],"with":["genie","mix","mem-recall","localboss","throne"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"agnixx-licence","name":"agnixx licence check \u2014 a badge is not a grant","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Checks whether a README's licence BADGE is backed by an actual LICENSE file. A badge is a claim; only the file is a grant, and with no file default copyright applies so nobody may redistribute at all. Three outcomes kept distinct: LIC-CLAIM-NO-FILE (no grant exists), LIC-MISMATCH (file disagrees with badge \u2014 the file wins), and LIC-UNVERIFIED (body unrecognised, explicitly NOT a pass, so an unparseable licence can never look like a verified match). Resolves the family by earliest position in the FILE and stops at any bundled-dependency heading, so a vendored ISC snippet cannot outrank the real MIT grant. Ignores docs/ READMEs and vendored trees.","mode":"On demand","kind":"cli","host":"This Mac","in":["repo or directory path"],"out":["ranked findings incl. LIC-* rules"],"can":["am I actually allowed to use this repo","does this MIT badge have a LICENSE file behind it","check a repo's licence before vendoring","find licence badge vs file mismatches","licence grant audit across many repos"],"with":["agnixx","repo-doctor","secscan","evaluate"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"agnixx-ratchet","name":"agnixx ratchet \u2014 debt may shrink, never grow, and the baseline cannot rot","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"A linter that asks is-it-perfect gets switched off on any real repo and then protects nothing. A ratchet asks is-it-WORSE-than-last-time, which is answerable \u2014 existing debt is frozen at today's size, new debt is refused, and exit 2 blocks the commit. The delta over every other baseline tool is that the baseline itself is not allowed to rot, and a rotted baseline is worse than none because it still reports success. Four rot modes are treated as violations rather than warnings \u2014 an exception for a file that dropped back under the limit grants silent permission to regrow, an exception naming a deleted file describes a repo that is not there, a cap written at or below the limit permits nothing while looking like a real exception and hides the ones that matter, and slack left under a cap is exactly where debt creeps back. Every entry must justify its own existence on every run. The metric is pluggable \u2014 any command printing a count and a path ratchets lint violations, type errors, TODO counts or bundle sizes with the same self-cleaning baseline. tighten deliberately never RAISES a cap, so accepting a regression has to be typed rather than done quietly by a cleanup command.\n","mode":"On demand","kind":"cli","host":"This Mac","in":["a repo root plus a .ratchet.json baseline (created with --init), or --metric-cmd printing count and path per line"],"out":["ranked violations by rot code with exit 0 clean, 1 could-not-check, 2 new debt; --fleet gives a roll-up across opted-in repos"],"can":["did this repo get worse than last time","block new technical debt without fixing the old debt first","freeze the lint or file-size baseline","stop this file from growing any further","my linter is switched off because the repo is already messy","gate a commit on debt not increasing"],"with":["agnixx","repo-doctor","commit","honesty","secscan"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"airscroll","name":"airscroll (touchless acoustic scroll)","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Scroll a Mac window with hand gestures in the air, using the laptop's own speaker + mic as sonar: emits an inaudible 20 kHz tone and reads the Doppler shift off a moving hand (SoundWave-style). Closer = scroll up, farther = scroll down. No camera, no extra hardware.","mode":"Service","kind":"bash","host":"This Mac","in":["hand motion near the laptop (acoustic); optional --target app name, --seconds, --invert, --trigger"],"out":["live scroll events to the frontmost/target window; --monitor prints the signal"],"can":["hands-free scrolling of any frontmost app (or a named --target app)","closer->up / farther->down mapping, speed scaled to motion","monitor mode to watch the live acoustic signal (asym/dev/motion)"],"with":["avsar (camera-free presence signal)","pahra (camera-free motion)"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"alertdesk","name":"alertdesk \u2014 per-recipient alert profiles + severity escalation ladder","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Decides WHO cares about an event and HOW LOUD it should be, then delegates delivery to fanout. Each recipient carries its own include/exclude/must keyword sets plus a min_severity floor, so one crawl serves several watchers without subscribing anyone to everyone else's noise. The severity ladder ADDS transports (info -> warn -> critical), so escalating can only widen reach, never narrow it. Delivery is counted with honesty.classify.Tally: a send that FAILED can never be reported as delivered, and an event is fingerprinted as seen only if at least one transport actually got through, so a wholly failed run stays retryable. Nothing is delivered without --send. Top rung is an audible LOCAL alert; there is no PSTN rung.","mode":"On demand","kind":"cli","host":"This Mac","in":["event JSON {title, body, severity, url}"],"out":["routing plan per recipient, or delivery tally"],"can":["route an event to the recipients who care about it","escalate an alert through more channels as severity rises","per-recipient keyword profiles over one shared feed","suppress duplicate alerts per recipient","report failed deliveries separately from suppressed ones"],"with":["fanout","im-send","chetna","honesty"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"assay","name":"assay \u2014 sealed-evidence gate for self-improving loops","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Referee for any loop that scores its own candidates. Splits a task list into a visible train set and an ENCRYPTED sealed test set, gates promotion on three checks computed only on train (Gate-f enough valid paired measurements, Gate-b the candidate's code actually ran, Gate-2 exact paired sign test vs baseline), then opens the seal ONCE at the end and reports retention: how much of the train gain survived on tasks the loop never saw.","mode":"On demand","kind":"cli","host":"This Mac","in":["task-id list file; per-trial scores; optionally a unified diff + an evaluation command"],"out":["PROMOTE/REJECT verdict with arithmetic; retention.json; credited true/false"],"can":["seal a task list into train + encrypted held-out test","record trials with fixed denominators and infra-failure exclusion","gate a round PROMOTE/REJECT with exact paired significance (no scipy)","prove attribution by tracing whether a diff's added lines actually executed","one-way unseal producing retention.json (overfit detector)","rank a whole FIELD by Bradley-Terry MLE with bootstrap rank ranges (assay rank) \u2014 answers which candidate is actually best","deal BLIND comparisons the judge cannot decode, and report the blinded fraction (assay blind); an unstamped vote counts as unblinded"],"with":["arena","apex","autoresearch","loopdoctor","cc-headless"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"avsar","name":"avsar","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Two-sided companion timing engine. OUTBOUND: decides WHEN a proactive message is worth sending (Bayesian reachability + info-gain + optimal-stop + PID rate governor). INBOUND (MaiBot steal): decides whether to SPEAK INTO a live chat (interest gate w/ over-talk decay), learns how well replies land (reply-effect -> quality EMA), and mirrors the user's speaking style (idiolect). Wired into akashvani (reachability gate) + anima (converse/express/persona-block). exit 0 SEND/SPEAK / 2 HOLD/QUIET.","mode":"On demand","kind":"cli","host":"This Mac","in":["observation/interest signal flags (hour/silence/reply-speed; addressed/relevance/novelty/question) or explicit gain values"],"out":["SEND/HOLD or SPEAK/QUIET verdict + belief/interest JSON; persona style block"],"can":["observe: interaction observation -> Bayesian belief over user state (chatting/idle/busy/sleeping/away/needing)","should: verdict SEND or HOLD now with reasons + score (exit 0 SEND / 2 HOLD)","gain: standalone is-this-message-worth-it info-gain check","rate: PID frequency governor vs a daily outreach budget","window: optimal-stopping best-moment across a short window","interest: INBOUND heartflow gate - should I chime in on this message? over-talk decay (exit 0 SPEAK / 2 QUIET)","effect: score how well my last reply landed -> running reply_quality EMA (the learning signal)","express observe/profile: learn + emit the user's speaking style (length/emoji/casing/slang)","converse: composite SPEAK verdict = interest gate AND reachable (won't blurt into a chat the user isn't present for)","persona-block: emit the learned style block for anima/voicestudio persona injection"],"with":["akashvani","nidhi","drift","im-send","anima"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"baton","name":"baton","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Hands a task in flight to a different brain without losing it. Saves a small harness-agnostic envelope (task, git state, auto-recalled memories) whose core is an evidence ledger splitting verified / believed / unchecked, then renders a resume brief for claude, codex, claudish or a fusion seat. Deliberately stores no transcript.","mode":"On demand","kind":"cli","host":"This Mac","in":["a task statement, plus notes appended during the work"],"out":["JSON envelope in a local folder and a rendered resume brief"],"can":["capture a task envelope with git branch/HEAD/dirty paths and mem-recall hits","record evidence as you go, bucketed verified vs believed vs unchecked","render a harness-specific resume brief that forbids promoting a belief to a fact","survive quota exhaustion or a deliberate mid-task model switch"],"with":["claudish","fusion-shim","cc-headless","mem-recall","handover","checkpoint"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"bendkit","name":"bendkit","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Remote harness that benchmarks the Bend language (auto-parallel GPU/CPU) vs numpy on the GPU box AND runs Bend's deductive proof-gate. bench measures GPU vs CPU vs numpy on the pow2 kernel (honest ledger, GPU engagement proven); prove verifies estate-shaped laws for ALL inputs with a vacuity self-test; demo points the honesty stack at Bend's own AI-written compiler; doctor checks the box toolchain.","mode":"On demand","kind":"cli","host":"This Mac","in":["subcommand (doctor|bench|prove|demo) + flags"],"out":["comparison table / proof verdict / audit buckets + JSON ledger in a local folder"],"can":["benchmark Bend GPU/CPU vs numpy on the box","prove estate-shaped laws for all inputs (deductive, non-vacuous)","audit Bend's AI-written compiler with the honesty stack","check the box Bend/clang/nvcc/numpy toolchain"],"with":["gpubox-bench","honesty","assay","labbench","secscan","agnixx"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"bhandar","name":"Bhandar \u2014 URC Kalimpong canteen shelves (CSD)","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Bhandar: the CSD canteen shopfront, Madhushala's sibling. ONE plain-text list (stock.txt, `## category` + `Name | qty | price | photo`) is the backend; `bhandar sync` reconciles shelves (add new, drop missing, keep the rest with hearts/photos). 338 items across the 7 official CSD groups with cut-out pack shots (SearXNG -> DDG -> Amazon -> OpenFacts ladder, brand-gated, rmbg). Customers heart items, fill a basket, reserve it under a day-fresh name (TIGER 02) with just their name; the counter's Telegram rings and /host has a Baskets tab (Packed/Collected). Dwell-time heat, comments, noticeboard. Static export lives on GitHub Pages (dtensor.github.io/urc-kalimpong) and calls this Mac's server (:8973) over Tailscale Funnel. Prices are indicative until the CSD rate list arrives.","mode":"Service","kind":"cli","host":"This Mac","in":["stock.txt (one list) or paste on /host","customer taps, baskets, comments on the web page"],"out":["web shopfront (/) and counter (/host, PIN)","a local folder{catalogue.json,carts.jsonl,interest.jsonl,attention.jsonl,comments.jsonl}","telegram basket ping (throne bot)","static/items/*.webp cutouts; static site export"],"can":["canteen-stock-display-any-device","one-list-backend-sync","product-pack-shot-fetch-cutout","customer-basket-reserve-to-telegram","item-demand-hearts-and-dwell-heat","csd-seven-group-catalogue","static-export-github-pages"],"with":["madhushala","rmbg","throne","freesearch"],"cmd":"","url":"","state":"responding","stateLabel":"Responding","stateNote":""},{"id":"cacheguard","name":"cacheguard","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Protects the prompt-cache stable prefix - the ~25k tokens of CLAUDE.md, rules/ and MEMORY.md prepended to every session. Finds volatile content (live counters, date stamps, regenerated metrics) that silently busts the cache, hashes the prefix to detect drift, and gates edits to the constitution files behind a logged justification.","mode":"On demand","kind":"cli","host":"This Mac","in":["none - reads the fixed PREFIX_FILES list"],"out":["ranked findings, prefix hash, per-file token breakdown, decision log"],"can":["size the stable prefix and show which files dominate it","find volatile counters/dates/metrics that invalidate the cache when they change","baseline the prefix hash and detect drift, naming the exact file that moved","block an edit to a governed system-prompt file until a reason is given and logged"],"with":["asv","quotabar","agnixx","egress-guard","baton"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"darshan","name":"darshan \u2014 the Nine Eyes","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Generalises the God's Eye View doctrine off the globe. Nine 'Eyes', each one substrate with many live feeds fused onto it, an analyst verb that computes over what is on the substrate now, and a freshness ladder that is DRAWN rather than footnoted. avidya=ignorance terrain (what you do NOT know), kala=one shared clock, raj=power graph, dhara=money/matter flows, sva=the estate as a city, chitta=attention, durga=exposure, deha=body, shilpa=making.","mode":"On demand","kind":"cli","host":"This Mac","in":["an eye name, and for the analyst verb a natural-language question"],"out":["a light-theme HTML page per Eye in a local folder plus an index; --json emits the scene (verdict, layers, marks); ask prints a verdict + basis"],"can":["avidya: render your own not-knowing as terrain and score a question RIDGE/SLOPE/VALLEY/HOLE","kala: every dated thing in the estate on one time axis, read vertically","raj: who decides X and how many hops you are from them (kautilya graph)","dhara: chokepoint + defence-trade flows, with mirror-gap reconciliation","sva: 420 tools / 542 repos as a graph, blast radius as a viewshed","chitta: where your hours actually went (webrecall + asv + amrit)","durga: what each agent identity can reach; exploit-aware findings","deha: your log + local environment + literature verdicts (educational only)","shilpa: every part you designed in one build volume with its gates"],"with":["mem-recall","secondbrain","nidhi","chetna","antar","kautilya","repo-doctor","codesight"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"downloadd","name":"downloadd","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Shared aria2 RPC download service \u2014 one aria2c --enable-rpc daemon owns the queue, a global concurrency cap, resume-across-restart, and STRUCTURED progress (DownloadStatus.percent, no stdout scraping), so every fetch tool talks JSON-RPC to it instead of spawning its own subprocess (which thrash one uplink at -j160 each). Stdlib-only; a private host-only + a local folder is the security boundary; ensure_daemon() starts it on demand. Metalink builder gives mirror-failover + checksum verify (the HuggingFace Xet dropped-connection hang). Stolen from tool-eval-aria2; getvideo wired behind GETVIDEO_USE_DAEMON.","mode":"Service","kind":"cli","host":"This Mac","in":["subcommand (serve|add|hf|metalink|status|list|pause|resume|rm|stop|doctor) + urls/flags"],"out":["gid + structured status table; files land in --dir"],"can":["queue a download to a shared aria2 daemon (global concurrency cap)","get structured progress (percent/speed/eta) over JSON-RPC, no stdout parsing","mirror-failover + checksum via Metalink (.meta4) \u2014 the HF Xet-stall fix","`downloadd hf <org/name> <file>` \u2014 pull a HuggingFace model with hf-mirror.com failover + sha256 verify from the HF API","pause/resume/list/remove downloads; queue survives a daemon restart"],"with":["getvideo","gpubox","bookhunter","getbooks","honesty"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"drona","name":"Drona (utility_meta)","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"the leverage ledger (meta-organ) \u2014 Monday 06:45 collects every organ's one-line brief (vismaya/kubera/akashvani/yashas/rishta/sena/parampara/kautilya/antar/nidhi), lists DEGRADED organs honestly, and answers ONE question with cited evidence: where does one hour of your time move the most this week; also `organs` fleet-doctor table","mode":"On demand","kind":"cli","host":"This Mac","in":["see subcommands"],"out":["light HTML + state in a local folder (+ Telegram where specced)"],"can":["drona","leverage ledger","where should I spend my hour","weekly leverage","organs status","what matters this week"],"with":["throne"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"estate-digest","name":"Estate Digest \u2014 Cross-Tool Intelligence Brief","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Estate Digest: dedupes, relevancy-scores (1-5) and synthesizes ONE prose brief over every content-producing tool in the estate (ledgers, observatories, nidhi, chetna, antar, rajdoot, samasya, manthan, bookpie/vidpie...), pulled live from the a private host-portal registry -- not health status, actual body text -- then delivers text + a NotebookLM podcast to a dedicated private Telegram channel.","mode":"Scheduled task","kind":"cli","host":"This Mac","in":["text/html","json"],"out":["text/markdown","audio/mp3"],"can":["cross-tool-digest","dedupe-and-relevancy-score","prose-synthesis","telegram-delivery","notebooklm-podcast"],"with":["nidhi","chetna","antar","throne"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"fablebench","name":"fablebench \u2014 referee-scored model benchmark on MY task mix","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"fablebench: benchmark harness over this user's five recurring task shapes (T1 evaluate+steal a repo, T2 build a CLI with honest exit codes, T3 cited brief over a fixed corpus with a planted contradiction, T4 alert-spam debug with a <=12-line fix, T5 register a tool across registries without touching the baseline preamble). Runs a model unattended via cc-headless in a fresh folder, then scores a PRISTINE referee copy of the gatekeep ledger the agent never touched. ERROR is never 0/N. Every task proven with a positive AND a negative control. `score` = model x task table. Use on new-model day.","mode":"On demand","kind":"cli","host":"This Mac","in":["model id"],"out":["results.jsonl","model x task markdown table"],"can":["new-model-head-to-head","regression-check-by-gates","task-mix-benchmark","referee-scored-unattended-run"],"with":["cc-headless","gatekeep","cc-canary","assay","avatar"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"freecatalog","name":"freecatalog","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Self-cleaning catalog of currently-FREE cloud LLMs + an importable cost=0 routing guard. Reads each provider's own price tag (prompt==0 && completion==0), drops models that turned paid, and enforces FREE_ONLY so a fallback can never silently touch a metered model. The cloud-fallback rung; the local seat stays primary.","mode":"On demand","kind":"bash","host":"This Mac","in":["provider catalogs; a model's prompt/completion price"],"out":["free-model catalog JSON (a local folder); guard verdict (exit 0 free / 2 priced)"],"can":["list cloud models that are $0 right now (OpenRouter catalog, keyless)","refresh + self-clean the free catalog (auto-remove models that turned paid)","enforce free load (Z.ai Coding Plan)","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Runs work on GLM-5.3 via the Z.ai Coding Plan subscription instead of burning Claude tokens. Wired as the provider rung directly behind xAI (out of credits) and ahead of local Ollama across the estate.","mode":"Service","kind":"cli","host":"This Mac","in":["A prompt, or an OpenAI-compatible chat request naming model glm / glm-5.3"],"out":["Model completion billed to the Z.ai Coding Plan subscription, not Claude quota"],"can":["Headless coding agent on GLM-5.3 with zero Claude tokens: cx <dir> '<prompt>' --glm","OpenAI-compatible chat on the fusion shim glm seat (a private host)","Explicit routing tier plan_glm on the local model router (a private host)","Automatic fallback when xAI/Grok fails in dr-jenny, digital-twin, droneforge, orchestrator, crucible"],"with":["cx","hydra","claudish","crucible","freecatalog","quotabar"],"cmd":"","url":"","state":"responding","stateLabel":"Responding","stateNote":""},{"id":"homebox","name":"Homebox Companion (utility_meta)","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"write/eyes side of the self-hosted Homebox asset register on the mini (sangraha is the read/economics side): intake a PHOTO -> local VLM (llava on mini) drafts the item, creates it, attaches the photo (abstains if it cannot identify the object); fetch printable QR / asset-ID labels; barcode product lookup -> create; search; doctor. All local/tailnet, stdlib-only.","mode":"On demand","kind":"cli","host":"This Mac","in":[],"out":[],"can":["homebox","scan a photo to inventory","photo intake to homebox","print a QR label for an item","asset label","barcode lookup and add","add to my inventory","catalogue my stuff"],"with":["sangraha"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"honesty-classify","name":"honesty classify \u2014 an error is not a verdict","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Three-bucket contract for anything that judges: pass / fail / ERROR, where the error can never merge into the other two. Decision.acted(policy) hands the caller the single boolean to act on and REQUIRES an explicit OPEN or CLOSED, because there is no sane default for what a broken classifier means. Tally.render() cannot omit a non-zero error count. Ships an AST auditor that finds functions returning a bool LITERAL from an except body \u2014 the shape that makes a crashed call indistinguishable from a real verdict. Handlers that re-raise, return a Decision, or return a computed value are left alone. '# classify: fail-open-ack' downgrades a reviewed site to INFO and STILL lists it, because a check that can only ever fire gets muted wholesale.","mode":"On demand","kind":"cli","host":"This Mac","in":["python source path"],"out":["ranked findings; exit 0 clean/acked, 1 MEDIUM, 2 HIGH"],"can":["did this classifier actually run or did it just fail open","audit code for error-as-verdict returns","count classifications without hiding the failures","wrap an AI/network judgement so crashes become a third bucket","check an LLM filter's failure handling"],"with":["honesty","agnixx","secscan","loopdoctor"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"honesty-lease","name":"honesty lease \u2014 a worker saying it is working is a claim, not progress","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"A delivered message describes the pipe; a still-working report describes the claim. Neither is progress, and treating either as progress is how a supervised fan-out reports healthy for hours while nothing happens. This is the decision contract behind agentwatch. A work lease is alive only while three things hold at once \u2014 it was granted against the agenda the worker is CURRENTLY assigned, it has not expired, and an evidence token the worker did not author has moved since the grant. The third gate is the one that matters, because a self-report from the component under suspicion is not evidence. A stale claim referencing a previous agenda is rejected outright rather than allowed to suppress a nudge forever. The escalation half is bounded on purpose \u2014 nudges are anti-thrash spaced and hard-capped, after which the worker is declared stuck with a named diagnostic and handed to a human, since nudging forever is the endless-autonomy failure loopdoctor flags. The budget resets only on a real event (the agenda changed, or corroborated progress happened), and re-posting the SAME agenda deliberately does not reset it.\n","mode":"On demand","kind":"cli","host":"This Mac","in":["a worker name, its agenda items, optional self-reports, and evidence tokens"],"out":["a decision per worker \u2014 idle, wait, nudge, cooldown, or escalate \u2014 with a reason and diagnostics; exit 0 wait or idle, 1 nudge or cooldown owed, 2 escalate"],"can":["is this agent actually working or only claiming to","should I nudge this worker, wait, or call a human","a worker keeps saying still working and nothing changes","when do I give up on an agent","reject a stale progress report about work it no longer owes"],"with":["agentwatch","cc-headless","fleet-build","assay","pm2-guardian"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"honesty","name":"honesty \u2014 self-reporting contracts (verdict/guard/provenance/budget/schema-aligned parsing)","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Makes a system's own claims checkable. Four contracts: a retrieval verdict that separates absent (corpus really scanned, counts attached) from degraded (index could not see, so silence proves nothing); a response-shape guard that catches a login/captcha/cookie/JS-shell page being served as data; a provenance ledger where a declared prior cannot wear measurement language and a measured number fingerprints its backing artifact; and a context-window budget over the whole skill surface.","mode":"Service","kind":"cli","host":"This Mac","in":["text/file/stdin for guard; hit+scan counts for verdict; name+value+artifact for number"],"out":["verdict line or JSON; exit 0=fine 1=weak 2=do-not-trust"],"can":["classify an empty search result as absent vs degraded, with proof of scan","reject a provider that served its own login page instead of results","block 'sentiment surged to 55' when 55 was never measured","detect a backing artifact that changed, vanished, or was always a constant stub","measure what the tool/skill surface costs in tokens on every turn","recover a JSON object or array from a local model that fenced it, reasoned in prose first, or was cut off mid-object -- with no extra LLM call","tell a model that got the schema right apart from one that only parsed after the parser healed four things (SapResult.repairs)"],"with":["mem-recall","freeintel","secondbrain","samizdat","defence-innovator"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"jevbench","name":"jevbench","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Held-out eval for the Jev typed-decision class: runs jev_lite's single-shot-JSON-decision core against JevBench (github.com/fstandhartinger/jevbench, MIT, 534 graded state+rubric->label decisions) and reports accuracy / calibration / speed / cost per difficulty tier.","mode":"On demand","kind":"cli","host":"This Mac","in":["difficulty split(s) + optional --limit; model via JEV_ENDPOINT/JEV_MODEL"],"out":["per-tier accuracy, mean Brier (calibration), mean latency, cost; --json optional"],"can":["grade a local model on easy/hard/original JevBench splits","replace jev_lite's single happy-path check with a real held-out number","compare on-device vs bigger local model on the hard decision tier","emit --json summary for an eval gate"],"with":["jev_lite","assay","labbench","fablebench"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"laya","name":"Laya Typed Decisions","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Fast local typed decisions on Apple Silicon (MLX): state + a bounded question -> choice/score/noul answer in ~11ms, 0 generated tokens, nothing leaves the box. The concrete FAST member of the Jev decision class (cf jev_lite/jevbench). guard subcommand = a learned prompt-injection/jailbreak classifier that catches reworded attacks the regex injection-scan misses (wired as a local folder, two-signal gate). Also triage/email(phishing)/gate(P-true)/route/bench/serve.","mode":"Service","kind":"cli","host":"This Mac","in":["state (text/json) + typed questions"],"out":["json decision with probabilities"],"can":["choice/score/noul typed decisions in ~11ms local, 0 tokens","learned prompt-injection/jailbreak guard (catches reworded attacks)","support/email/phishing triage; P(true) confidence for abstain gates"],"with":["jev_lite","jevbench","injection-scan (guard_ml.py)","abstain_gate","inbox-agent"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"lean-harness","name":"Lean Harness (capability router)","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Routes a task to the right skill/tool and keeps session continuity ledgers (hook, route, checkpoint).","mode":"On demand","kind":"cli","host":"This Mac","in":["task description"],"out":["suggested capabilities / ledger files"],"can":["capability-routing","session-checkpoint"],"with":[],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"localrealtime","name":"localrealtime","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Local OpenAI-Realtime-compatible WebSocket server backed by ollama native tool calling. Serves the same wire a cloud realtime voice API does, so any Realtime client runs fully on-device with no API key and no network. Built to make qwen-audio-agent drive Claude Code over ACP with zero cloud.","mode":"Service","kind":"cli","host":"This Mac","in":["OpenAI-Realtime events over WebSocket (session.update, conversation.item.create, response.create)"],"out":["response.text.delta/done, response.function_call_arguments.done, response.done"],"can":["serve the OpenAI Realtime event envelope from a private host","relay native tool_calls (spawn_thinking etc.) from a local model","substitute for a cloud realtime provider without forking the client","run any Realtime-protocol app offline/private"],"with":["anima","gptface","claudish","wegent"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"macuse","name":"macuse \u2014 drive GUI-only macOS apps zero-focus, with proof","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Controls native macOS apps that have no CLI/API by posting events straight to the target process (zero focus, cross-Space, works even when the window is covered), then pixel-diffs the click point and returns an honesty effect verdict. Vendored Swift kernel (alchaincyf/huashu-mac-use, MIT) wrapped with three estate disciplines: the weave cost-descending interface ladder (L0 structural -> L1 AX -> L2 coords -> L3 pixel), the avsar opportune-moment batch gate, and the honesty desktop-action verdict. The desktop twin of browser-harness; drives Electron desktop apps (Cursor/Slack/Claude Desktop) over CDP.","mode":"On demand","kind":"cli","host":"This Mac","in":["an app name or window id; a control action (see/shot/op/cdp); optionally --dry to preview gates"],"out":["window screenshots + AX tables; an effect verdict per write (exit 0/1/2); probe recon report"],"can":["probe an app: bundle/arch/URL-scheme/local-ports/AX-control-count + dup-install warning","read a window zero-focus: screenshot (even if covered) + AX element table","write zero-focus: post click/keystroke to a pid, verify by pixel-diff, borrow focus only if unconfirmed","drive an Electron desktop app over its debug port (macuse cdp)","when-away: avsar verdict on whether it is safe to take the screen for a background task","honesty effect verdict confirmed|partial|suspected_noop|unverifiable (a tool-exit-0 no-op is not done)"],"with":["weave","avsar","honesty","opendesk","browser-harness","iphone-harness"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"madhushala","name":"Madhushala \u2014 house-bar menu on the iPad / Z Fold","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Madhushala: the house-bar menu for the iPad and the Z Fold. Guests tap their name, browse chapters (Spirits / Cocktails / Mocktails & Zero-proof / Wine / Beer), see the REAL bottles standing on a shelf (product photos fetched and cut out locally with rmbg), pick one and how they want it; the request lands on /host and on the host's Telegram. Cocktails appear only when every base they need is in stock. Stdlib server on the Mini (PM2 madhushala :8972, LAN a private host / tailnet a private host); pictures and stock edits happen on the Mac then `madhushala sync`. Ask: who ordered a drink?","mode":"Remote service","kind":"cli","host":"a private host","in":["bottle names (+cat/style/origin/abv/note)","guest taps on the iPad/phone"],"out":["web menu (/ guest, /host host)","a local folder","telegram ping","static/bottles/*.png"],"can":["home-bar-menu-ipad","guest-drink-requests-to-telegram","bottle-photo-cutout-shelf","stock-aware-cocktail-menu","tailnet-device-registry"],"with":["rmbg","throne","parda","iphone-harness"],"cmd":"","url":"","state":"responding","stateLabel":"Responding","stateNote":""},{"id":"mem-recall-learn","name":"mem-recall learn (backpass gap ledger)","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Reads past agent session transcripts, folds recurring correctable gaps into a cross-session evidence ledger, and stages evidence-gated candidate memories once a gap is seen in >=2 independent sessions (backpass steal). Never writes live memory; a human approves via `mem-recall approve <slug> --by me`.","mode":"On demand","kind":"cli","host":"This Mac","in":["recent session transcripts (a local folder<proj>/*.jsonl)"],"out":["staged proposals in memory/proposed/ + gap-ledger.json"],"can":["Scan recent session transcripts for recurring correctable gaps","Enforce a >=2-independent-session evidence gate before proposing (anti-noise)","Merge case/punctuation gap-key variants so one real pattern isn't split","Stage candidate feedback notes via the dual-actor propose_gate","Read-only ledger view (--status) and rejection memory (--reject)"],"with":["mem-recall","memguard","assay"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"navin","name":"Navin \u2014 What Changed Overnight (one morning page)","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Navin: the ONE morning page -- what changed overnight across every daily-rebuilt page (India Ledger, Republic X-Rayed, Defence Ledger, Edge, Defence Perspective, HN front page, Vismaya, Tender Edge, Kalpataru). Splits each page into text blocks, fingerprints them with dates/times/build-stamps stripped, and shows ONLY blocks first seen today, most-changed page on top, link to the full page; unchanged pages collapse to a chip row; a page that did not rebuild is named STALE with its LaunchAgent (silence never reads as a quiet day). Replaced nine per-page auto-opens with one Comet window at 08:12. Ask: did the ledger change?","mode":"Scheduled task","kind":"cli","host":"This Mac","in":["html pages listed in tools/navin/sources.json"],"out":["html (a local folder + editions/)","telegram one-liner","throne brief line"],"can":["overnight-change-detection","consolidated-morning-page","stale-page-honesty-ledger","novelty-ranked-digest"],"with":["throne","indiawatch","govwatch","edgewatch","hnpress","vismaya","tenderwatch","kalpataru"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"parda","name":"Parda Projector Bridge + Live Channel Grid","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Voice/HTTP/phone control of the Formovie projector (Family Room TV) from the Mac Mini bridge :8968: power on/off (WAKEUP/SLEEP), remote keys, app launch (remote v2 + ADB), cast any stream/YouTube, OmniVue channel lookup and natural-language channel finder, TiviMate playlist/EPG, and a LIVE MULTIVIEW GRID: 'grid of top news from India, Pakistan, Russia, Ukraine and America' resolves up to 16 channels in spoken country order, one ffmpeg worker per tile + numpy compositor + one HLS encoder played by VLC on the projector; 'grid focus N' enlarges a box full screen with its sound, 'back to grid' returns, 'grid sound from N' switches audio; dead channels auto-restart and swap for a same-country spare. Phone remote = home-screen web app at /remote with live tile thumbnails (tap to enlarge). Channel sources: OmniVue + community playlists refreshed every 12 h (Guovin Chinese list, Free-TV) with every link per channel kept; news detected from names and per-country flagship brands (CCTV-13, \u0420\u043e\u0441\u0441\u0438\u044f 24, Al Arabiya, Espreso\u2026); 'chinese news' means the language. Streaming: each tile reads at native rate (-re) so boxes don't lurch-and-freeze; channels that keep failing on this connection sink for a week (a local folder); a dead box tries the channel's next link, then a same-country spare, then any spare. Phone box accepts typed commands (enlarge 3 / back / sound 4 / stop).","mode":"Remote service","kind":"http","host":"a private host","in":["plain-English request (channel name, grid query, 'grid focus N', 'back to grid', power/keys)"],"out":["JSON result + the projector changes; grid order returned as a numbered list"],"can":["turn the projector on/off and press remote keys","put a named channel or YouTube search on the wall","show a live grid of up to 16 channels from any country/language/category mix","enlarge one grid box full screen with sound and return to the grid","control everything from an iPhone home-screen remote with live thumbnails","expand thin regions (e.g. Chinese news 5\u2192143 candidates) from community playlists","learn which channels actually play on this connection and stop picking dead ones","control the Apple TV (status, power, apps, remote keys) with '... on the apple tv' phrases","play channels/YouTube/grid/nightcast/the reading wall through VLC on the Apple TV (wall_target=appletv)","wake the whole wall from off: waking the Apple TV powers the projector on over HDMI-CEC"],"with":["omnivue","home-assistant","nightcast"],"cmd":"","url":"","state":"unreachable","stateLabel":"Unreachable","stateNote":""},{"id":"pm2-guardian","name":"pm2-guardian (bounded-autonomy self-healing gate for PM2)","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Deterministic risk-tiered gate in front of PM2 self-healing. Detects faults from 'pm2 jlist', proposes a remediation, then decides whether it may run: the tier comes from the ACTION and blast radius, never from the proposer's own risk rating. T1 auto, T2 cooldown, T3 human queue, T4 always rejected. Cooldowns and sliding-window counters persist to a local folder under an fcntl lock, so the guardian's own restart cannot reset the limits it enforces. Breaching a window cap ESCALATES to the human queue rather than denying.","mode":"On demand","kind":"cli","host":"This Mac","in":["none (reads pm2 jlist)"],"out":["tiered decision table per fault","audit jsonl records","doctor config dump"],"can":["scan PM2 for real faults (errored, stopped, flapping, high memory) without acting","gate every proposed remediation against a deterministic action-to-tier map","reject destructive actions (delete, reset_state) unconditionally","escalate one tier when a remediation touches 3+ services","rate-limit repeat heals per (service, action) across ":"cli","host":"This Mac","in":["see subcommands"],"out":["light HTML + state in a local folder (+ Telegram where specced)"],"can":["rishta","follow up with","who am I neglecting","relationship ledger","log that I met","suggest intros"],"with":["throne"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"runway","name":"runway \u2014 live per-session quota burn (Codex + Claude)","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Headless live per-session quota-burn meter. Reads Codex/Claude session files, keeps only activity inside a rolling 5h or weekly window, and shows burn per session in one of four lenses (tok/h, $/h API-rate, % of quota). Codex's self-reported used_percent/resets_at is shown as authoritative [provider]; unpriced models read 'can't verify' not $0; Claude % needs a cookie (unverified path) else n/a. Headless port of the Agent Sessions (jazzyalex) Session Runway; complements asv spend (historical) with a live per-session view the GUI cannot pipe into a cron/throne digest.","mode":"Scheduled task","kind":"cli","host":"This Mac","in":["none (reads a local folder + a local folder)"],"out":["per-session burn table / JSON"],"can":["which running session is eating my 5-hour / weekly limit","per-session tokens/hour or estimated $/hour burn rate","provider-reported quota % for Codex with reset countdown","live watch dashboard (--watch N)","JSON for throne/cron consumption"],"with":["asv","quotabar","island","throne","agent-sessions (GUI app)"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"safe-expr","name":"safe_expr","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Numeric-expression evaluator whose grammar IS the sandbox \u2014 evaluates math like 'end - 0.5' or 'clamp(len/target, 0.1, 10)' to a single number and cannot produce anything else (no strings, names, imports, or shell chars), so a hostile spec value cannot inject into a nal-title","iterm-badge"],"can":["table of every live Claude/Codex terminal seat with its handle and SendMessage name","resolve a short handle (S10) to the name another session passes to SendMessage","own the tab title: '<HANDLE> <working|waiting glyph> <topic>'","iTerm badge watermark + barista statusline segment","raise/focus the terminal window holding a handle","fleet-bind names from ListAgents output, refusing ambiguous matches"],"with":["island","agentwatch","throne","weave"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"skillscout","name":"Skillscout \u2014 Worth-Evaluating Skill Feed","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Skillscout: external agent-skill discovery feed that seeds /evaluate, the estate-honest inverse of linkly.ai/skills. Linkly ranks skills to INSTALL, dominated by install count + social momentum; skillscout never installs and curates on what the estate cares about -- novelty (new to us, checked against estate.json AND 642 tool-eval memories), relevance (fit to estate domains), maintenance (recent push), publisher trust -- with popularity capped as a <=0.05 tiebreaker so it can never rank, only break a tie. Crawls GitHub skill topics (keyless gh) as the LIVE source; hosted registries (skills.sh/skillhub.cn/clawhub) report DEGRADED/ABSENT honestly, never fabricated rows. Prints a ranked list with a ready '/evaluate <url>' under each, and writes a feed parampara ingests.","mode":"On demand","kind":"cli","host":"This Mac","in":["none (crawls GitHub skill topics) or a prior scan on disk"],"out":["ranked worth-evaluating candidate list (+ /evaluate lines) and JSON feed"],"can":["external-skill-discovery","worth-evaluating-scoring","prior-eval-dedup","source-health-honesty","parampara-feed"],"with":["parampara","evaluate","mem-recall"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"weave","name":"Weave (interface arbiter + verifier stress)","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"per-step interface arbiter + verifier stress-test for computer-use agents (Yutori Navigator n2 STEAL->BUILT). weave plan ranks gui/cli/api/code with reasons (one shell loop beats 100 GUI clicks); weave record referees progress via environment-derived evidence tokens (dir:/file:/cmd: digests \u2014 agent self-report never counts) and flags STUCK (same interface, no env change -> SWITCH exit 2) and BOUNCE (interface-hopping without progress -> HOLD); weave stress vacuity-tests a verifier (must FAIL on the untouched environment, else VACUOUS exit 2 \u2014 a done-test that cannot fail is fake); weave verify runs the gatekeep-shaped CHECK/EXPECT done-test (crash = ERROR exit 1, never a verdict).","mode":"On demand","kind":"cli","host":"This Mac","in":["step description / session json / CHECK+EXPECT verifier"],"out":["ranked interfaces with reasons; SWITCH/HOLD advice; VACUOUS/FALSIFIABLE; PASS/FAIL"],"can":["rank gui/cli/api/code interfaces per step with stated reasons (deterministic, no LLM)","referee agent progress by evidence tokens the agent did not author (dir:/file:/cmd: digests)","detect STUCK (N same-interface no-progress steps -> SWITCH, exit 2)","detect BOUNCE (interface switches without environment change -> HOLD, exit 2)","vacuity stress-test a verifier: must fail on the untouched environment","run CHECK/EXPECT verifiers on the end state (exit 0 pass / 1 error / 2 fail)"],"with":["gatekeep","agentwatch","cc-headless","browser-harness","assay"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"webrecall","name":"webrecall \u2014 browsing-history recall (what you LOOKED AT)","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"Read-only recall over local Chromium browsing history and bookmarks. CDP has no Bookmarks or History domain (which is why BrowserOS forked Chromium); the answers sit in the profile files on disk. Measured live: 12 profiles / ~305k URLs across Chrome, Chromium, Edge, Arc and Dia. Credential-shaped query params are redacted before any display or export, and an unreadable source reports DEGRADED rather than rendering as a confident zero.","mode":"On demand","kind":"cli","host":"This Mac","in":["free-text query, a date, or an hours/days window"],"out":["ranked visits with timestamps + an honesty banner naming every source read"],"can":["find a page you visited months ago by title/url terms","what did I read on <date> / in the last N hours","search saved bookmarks across every browser at once","top domains in a window (where does my time actually go)","redacted JSONL export for LOCAL indexers only"],"with":["mem-recall","secondbrain","agentid"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"yantra-mobile","name":"yantra","hall":"daily","group":"Everyday & utilities","cat":"utility meta","what":"One device-automation vocabulary across iOS simulators, Android devices/emulators, and (via the mobile-mcp engine) real iPhones \u2014 superbuilt over mobile-next/mobile-mcp with estate toolbase the upstream and Maestro/Appium MCP lack.","mode":"On demand","kind":"cli","host":"This Mac","in":["a subcommand + a booted iOS simulator or an adb device (yantra doctor reports readiness honestly)"],"out":["device screenshots (a local folder), VLM answers, injection verdicts, structured element lists, qa pass/fail"],"can":["ask: screenshot -> PRIVATE on-device VLM (ollama qwen2.5-vl) Q&A; phone pixels stay on the Mac (--cloud opt-in)","scan: read on-screen text then injection-scan it (security layer no mobile tool ships)","elements: weave structured-first tree (Android adb uiautomator WDA-free / iOS WDA engine / honest VLM fallback)","devices: honest verdicts NO_DEVICES/NONE_READY/AMBIGUOUS/DEGRADED","qa: JSON check-flow with assert_text/assert_vlm verified against the real device","watch: VLM-narrate only meaningful screen changes (abstain-gated
