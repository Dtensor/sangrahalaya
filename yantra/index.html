n"],"out":["see description"],"can":["live artifact","claude code artifacts","shareable dashboard","watch it build live","live status page","share this page with the team","incident page","live walkthrough","auto-updating page","live dashboard"],"with":[],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"loopdoctor","name":"loopdoctor CLI","hall":"daily","group":"Everyday & utilities","cat":"utility/meta","what":"Static auditor for autonomous-agent loops (7-check AST/regex linter + optional local-LLM cross-check). Audits one loop or the whole daemon fleet for overfit-verification, endless-autonomy, unguarded-destructive, stale-state, hallucinated-helper, and unguarded data-exfiltration (C7 shell-risk, via riskgate) smells. Mines tools/ + LaunchAgents into a local loop catalog. Local incarnation of Forward-Future/loop-library. Backed by the loop-design rulebook (a local folder \u2014 MANDATORY pre-read before designing or authorizing any loop) which adds pre-design refusal gates \u2014 stop signs (lethal trifecta, review-pace, regulated-no-human-gate, intent-debt legacy, agent lacks engineer's tools), a ~weekly amortization floor (below it write a one-off script), and a 9-box unattended-readiness checklist (rollback, escalation path, 24h trajectory).","mode":"Service","kind":"cli","host":"This Mac","in":["see description"],"out":["see description"],"can":["loop doctor","audit loop","audit this loop","is this loop safe","check my daemons","loop health","overfit verification","endless loop","loop design","design a loop"],"with":[],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"selfheal","name":"Self-Heal Gate (failure \u2192 recursive improvement)","hall":"daily","group":"Everyday & utilities","cat":"utility/meta","what":"When ANY tool fails from a CODE/capability gap, classify it (capability-gap vs external-wall vs config vs transient) and run a bounded recursive-improvement loop (domain hook \u2192 APEX / headless codex / claude) with the REAL command as the success oracle, iterating until it works \u2014 then the fix persists. Stops honestly on external walls instead of looping forever. Opt-in per tool.\n","mode":"On demand","kind":"cli","host":"This Mac","in":["text"],"out":["structured_data","code_changes"],"can":["self-heal","auto-fix","recursive-improvement","failure-routing","capability-gap-repair"],"with":["getmagazines","apex"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"skill-export","name":"skill-export CLI","hall":"daily","group":"Everyday & utilities","cat":"utility/meta","what":"Multi-IDE skill exporter for Codex/Cursor/client bundles","mode":"On demand","kind":"cli","host":"This Mac","in":["see description"],"out":["see description"],"can":["export skills","codex bundle","cursor rules","client bundle"],"with":[],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"stealthbrowser","name":"stealth CLI","hall":"daily","group":"Everyday & utilities","cat":"utility/meta","what":"Patchright-backed undetected-browser tier \u2014 the stack's 3rd anti-detection paradigm (CDP-protocol-leak patching), built from the patchright eval after the thin rickicode wrapper was SKIP'd. `stealth launch` spawns a patched Chromium (Apache-2.0 patchright) that does not leak via Runtime.enable/Console.enable or the --enable-automation tells, exposes a CDP endpoint, and prints a BU_CDP_WS= line. browser-harness attaches to it via its existing remote-CDP seam (admin.py, zero core edits), so every harness command keeps working but now over an undetected browser \u2014 for headless servers or throwaway automation that must clear a Cloudflare/DataDome wall where the real-Chrome passthrough is impossible. `stealth check` audits the bot tells through patchright (gold-standard CLEAN proof); `stealth flags` emits the portable add/remove/CDP-discipline flag-set so any raw-CDP launcher gets the flag-level cloak. Complements browser-harness (passthrough, detection-only default) + fingerprint.py (UA/tz/canvas spoof). Headed > headless; closed-shadow piercing NOT supported (patchright 1.61 verified-negative). Dual-use evasion \u2014 authorized targets only.","mode":"On demand","kind":"cli","host":"This Mac","in":["see description"],"out":["see description"],"can":["stealth browser","undetected browser","patchright","evade bot detection","bypass cloudflare","bypass datadome","headless stealth","anti-detection browser","undetectable scraping","navigator.webdriver"],"with":[],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"vizprobe","name":"vizprobe Measurement Probes","hall":"daily","group":"Everyday & utilities","cat":"utility/verification","what":"Pixel and geometry measurement probes for generated visual output, carrying three anti-self-deception disciplines stolen from StarKnightt/night-street: worst-case window (a claim about a surface is a claim about its WORST window, never a chosen sample), residual-across-a-sequence (judge the worst stop not the eyeballed first frame), and a scars registry of measurements that once lied (glFinish-async frame, HTTP-200-zero-bytes, exit-0-no-output). Wired into figcheck (raster image path) and 3d-models/vastu render-residual.","mode":"Service","kind":"cli","host":"This Mac","in":["an image (path/bytes/ndarray), a measured sequence JSON, or a (name,value) to scar-check"],"out":["worst-window extremes, residual table (held/drifted), or a scar hit; exit 0/1/2/3"],"can":["worst-case-window-search","flatness-claim-on-worst-not-mean","residual-across-render-sequence","geometry-lock-held-across-camera-walk","known-false-measurement-guard"],"with":["figcheck","model3d","vastu","honesty","assay"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"assay-flex","name":"assay flex \u2014 is this artifact actually parametric?","hall":"daily","group":"Everyday & utilities","cat":"verification","what":"Changes an input, rebuilds, and asserts the output tracked. Catches a body that hardcodes the value its signature claims to take \u2014 invisible to a static read and to every single-input test.","mode":"On demand","kind":"cli","host":"This Mac","in":["a JSON probe file: {build, metric, probes[]}"],"out":["per-probe verdict; exit 0 tracked / 1 NOT CHECKED / 2 did not track"],"can":["catch a declared parameter that is consumed nowhere","catch a value wired through the WRONG formula (proportional mode)","catch an input leaking into an output it does not own (constant mode)","works on any build command, not just CAD"],"with":["partgate","honesty-provisional","assay"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"honesty-expect-code","name":"honesty expect-code \u2014 did this fixture fail for the right reason?","hall":"daily","group":"Everyday & utilities","cat":"verification","what":"Assert that a negative fixture failed for the REASON it was written to test. Each fixture declares the diagnostic code it must provoke and expect-code asserts that CODE, not the exit status - which a missing file, an absent dependency and a crash before the tested path all produce too. Four vacuity guards: an undeclared fixture is a FAILURE not a skip, an empty corpus exits 1 (COULD NOT CHECK, never a pass), a declared fatal code with exit 0 fails, and an all-negative corpus is flagged because a checker that rejects EVERYTHING passes one clean.","mode":"On demand","kind":"cli","host":"This Mac","in":["fixture directory","command template","code taxonomy"],"out":["per-fixture verdict","coverage report"],"can":["assert a negative test emitted a specific diagnostic code","catch a fixture that fails for the wrong reason","catch a test suite that asserts nothing at all","flag a corpus with no positive control","report documented codes that no fixture covers","report emitted codes that no document lists","gate a commit on diagnostic stability"],"with":["honesty","xplain-storyboard","loopdoctor","assay"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"honesty-provisional","name":"honesty provisional \u2014 was this magnitude ever declared?","hall":"daily","group":"Everyday & utilities","cat":"verification","what":"Reads source for load-bearing magnitudes sitting inline in an expression, where they cannot be overridden, probed, or given a rationale. A named number is accounted for; an inline literal is not.","mode":"On demand","kind":"cli","host":"This Mac","in":["files or directories (+ optional --ledger)"],"out":["findings with file:line; exit 0 accounted / 1 COULD NOT CHECK / 2 undeclared"],"can":["catch a plausible number silently baked in instead of recorded","discharge values against a honesty provenance Ledger","audit a report or a source tree with no build required"],"with":["assay-flex","partgate","honesty"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"honesty-reconcile","name":"honesty reconcile \u2014 do these figures agree with each other?","hall":"daily","group":"Everyday & utilities","cat":"verification","what":"Checks a set of stated numbers against ITSELF using arithmetic identities, so a fabricated table is caught with no artifact, no network and no API key. India-only rule packs.","mode":"On demand","kind":"cli","host":"This Mac","in":["stated figures via --set (accepts Rs/INR/crore/lakh/1,23,456/%) or --fields <json>"],"out":["per-identity PASS/FAIL/SKIP with stated vs implied and relative error; exit 0 pass / 1 NOT-CHECKED / 2 contradiction"],"can":["catch a fabricated EPS/PAT/share-count combination in an NSE/BSE note","catch an intra-state GST filing where CGST != SGST","verify a broking contract note (18% GST on brokerage+exchange+SEBI, never on STT)","check STCG/LTCG tax against gain, exemption and rate (FY2025-26 defaults as inputs)","check any budget or timeline where parts must sum to a vatar never grants a real login itself, only a sandboxed disposable-email identity.","mode":"Service","kind":"cli","host":"This Mac","in":["role name + brief text; optional tier"],"out":["honesty-bucketed run report (markdown) + JSONL progress log"],"can":["define a persistent role with an autonomy tier (T1 reversible-only, T2 risky-actions-gated, T3 everything-gated)","spawn it as a real unattended cc-headless run and report back Verified/Believed/Not-checked, never a vague done","give the role a sandboxed disposable-email identity via smails, never a real login","refuse to grant a real credential without both --grant-login and --i-understand, then hand off to a human-run browser-harness + agentid audit","show what a spawned role is currently blocked on waiting for human approval","audit what identity a terminated role ever actually touched","browse a library of 182 ready-made bot-template presets (mined from awesome-grok-bot) via avatar preset list/show","instantiate a role straight from a preset via avatar preset use <slug> (31 money/publish/delete presets default to T3)"],"with":["cc-headless","agentwatch","pm2-guardian","smails","agentid"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"inbox-agent","name":"inbox-agent","hall":"daily","group":"Everyday & utilities","cat":"workflow utilities","what":"Plain-English rules engine over a real inbox. Sorts/labels/drafts/tracks email via an ordered cheap-first match tree (static->learned->cold->AI-last, so a static/learned hit never pays for an LLM call). Plan-only; never auto-sends.","mode":"On demand","kind":"bash","host":"This Mac","in":["an email JSON record {from,to,subject,body,thread_id}; plain-English rules"],"out":["an action plan of Gmail-MCP calls (sending actions parked for a human)"],"can":["compile plain-English inbox instructions into structured rules","sort one email into an action plan (dry-run, never sends)","track who owes whom a reply (To Reply / Awaiting Reply)","promote a repeat sender into a free static rule (learning loop)","degrade honestly when the AI tier is down (DEGRADED != no-match)","run a daily unattended auto-triage (LaunchAgent com.king.inbox-agent-daily 07:45) that fetches the last 24h of inbox, auto-applies labels, and sends a Telegram brief; headless agent is allowlisted to Gmail search/list/label only (never sends)"],"with":["Gmail MCP (executor)","throne (brief line)","fusion-shim :8051 (AI tier)"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"calib-sentinel","name":"Calibration Drift Sentinel","hall":"forge","group":"Agents & reasoning","cat":"advisory","what":"Watches whether '70% confident' still means 70%-right across the Brier ledgers (edge-oracle/regime-court). Wilson-CI drift-vs-variance gate distinguishes genuine calibration decay from small-sample noise, then emits a T2 confidence-haircut throttle advisory. Advisory-only.","mode":"On demand","kind":"cli","host":"This Mac","in":["brier-ledger.db"],"out":["drift-verdict","haircut-advisory"],"can":["calibration-monitor","drift-detection","reliability-diagram","confidence-throttle-advisory"],"with":["edge-oracle","regime-court","the-adversary"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"capital-committee","name":"Capital Committee","hall":"forge","group":"Agents & reasoning","cat":"advisory","what":"Nightly portfolio manager that allocates compute across self-improvement loops (apex/autoresearch/omega) by marginal-gain-per-hour, with a diminishing-returns curve and a no-starve floor. Honesty banner splits MEASURED gain from ASSUMED/SYNTHETIC (logs record gain but not duration). Advisory-only.","mode":"Scheduled task","kind":"cli","host":"This Mac","in":["loop-run-histories","budget-hours"],"out":["allocation-table","rationale"],"can":["compute-allocation","marginal-gain-ranking","loop-instrumentation","allocation-scoreboard"],"with":["asi-evolve","autoresearch","calib-sentinel"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"crucible","name":"Crucible \u2014 Adversarial staff-officer chamber","hall":"forge","group":"Agents & reasoning","cat":"advisory","what":"War-game ANY idea, decision, plan, link, or word and return a REASONED, sharper solution \u2014 not a yes/no. An eager Advocate (Gemini 3.1 Pro) pitches; a ruthless Skeptic (Grok 4) demands proof and finds the cons; pitch\u2192attack\u2192defense\u2192kill-shot; then a frontier Fusion (Opus 4.8 + GPT-5 + Gemini + Grok \u2192 Opus synth) adjudicates into VERDICT (PROMOTE/KILL/RESHAPE/DEFER) + a developed solution + flip-lever, all briefed with the user's Commander's Intent. Also runs daily on accumulated learnings.\n","mode":"On demand","kind":"cli","host":"This Mac","in":["text/idea","url","decision","plan"],"out":["reasoned-solution","verdict","flip-lever"],"can":["stress-test-idea","pro-con-decision","go-no-go","thrash-out-idea","adversarial-debate","develop-better-solution","decision-gate","second-opinion","war-game-plan"],"with":["evaluate","brainstorm","redteam","fuse-pro","mirofish"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"fuse-pro","name":"Fuse-Pro \u2014 Cross-provider frontier fusion","hall":"forge","group":"Agents & reasoning","cat":"advisory","what":"Mixture-of-Agents: fan a prompt to four frontier models IN PARALLEL \u2014 Opus 4.8, GPT-5, Gemini 3.1 Pro, Grok 4 \u2014 then Opus 4.8 synthesizes one best answer using an additive judge prompt. Beats solo Opus (dual-judge benchmarked) by a modest ~1pt margin at 3-4x cost. All cloud, zero local RAM. Adapter health checks + graceful degradation (fuses whoever is live).\n","mode":"On demand","kind":"cli","host":"This Mac","in":["text/prompt"],"out":["synthesized-text"],"can":["frontier-fusion","best-possible-answer","cross-provider-ensemble","mixture-of-agents","high-stakes-question","opus-gpt-gemini-grok"],"with":["supermodel","fuse-code","gyan","deep-research"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"supermodel","name":"Supermodel \u2014 Multi-model congregation","hall":"forge","group":"Agents & reasoning","cat":"advisory","what":"Fan out a prompt to multiple AI models simultaneously (Claude, Codex, Gemini, Ollama, FreeIntel), then synthesize into one authoritative answer. Three modes: --parallel (all models, one round), --debate (3-round adversarial), --council (free seats \u2192 paid synthesis, ~90% cheaper). Also grounds in live research via freeintel.\n","mode":"On demand","kind":"cli","host":"This Mac","in":["text/prompt","stdin-context"],"out":["synthesized-text"],"can":["multi-model-ensemble","adversarial-debate","model-synthesis","cost-optimized-council","research-grounded-answer","fill-censorship-gaps","escalate-on-disagreement"],"with":["gyan","mirofish","deep-research","factcheck"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"agentwatch","name":"agentwatch","hall":"forge","group":"Agents & reasoning","cat":"agent toolchain","what":"Tells a BUSY unattended agent from a DEAD one \u2014 the two look identical, because both are silent, neither errors, and the run reports healthy the whole time. Every fan-out surface in this stack (cc-headless, fleet-build, overnight-feature, edge-agent, wegent) could start a worker and had no way to notice it had stopped, so an eight-hour overnight could be eight hours of nothing. agentwatch refuses to accept the agent's own still-working report, because that re-trusts the component under suspicion \u2014 the same mistake pm2-guardian avoids by re-deriving risk from the action instead of the proposer's self-rating. Instead it derives an evidence token the worker did NOT author (git HEAD plus working-tree shape, newest mtime under a tree with noise dirs excluded, a growing stream file, or any command) and a lease lives only while it was granted against the CURRENT agenda, has not expired, AND that token has moved. Recent corroborated progress vouches for a worker that cannot claim at all, which is most of them \u2014 a headless Claude Code run never calls claim and does not know a supervisor exists. Nudges are anti-thrash spaced and hard-capped at four, then the worker is declared stuck and handed to a human with a desktop notification, because nudging forever is its own failure mode. Decision logic lives in honesty lease.\n","mode":"On demand","kind":"cli","host":"This Mac","in":["a worker name plus a repo or explicit evidence sources (git:/mtime:/file:/cmd:)"],"out":["one line per worker \u2014 ok, nudge owed, cooldown, or STUCK \u2014 with exit 0 healthy, 1 nudge owed, 2 a human is needed; desktop notification on escalation"],"can":["is my unattended agent stuck or still working","did the overnight run die while I was asleep","the agent went quiet and nothing has happened","supervise a headless or fleet agent run","prove an agent is making real progress, not just saying so","escalate a dead agent to a human instead of nudging forever"],"with":["cc-headless","fleet-build","overnight-feature","honesty","pm2-guardian"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"island","name":"island","hall":"forge","group":"Agents & reasoning","cat":"agent toolchain","what":"island-attention-monitor: hookless attention monitor + terminal focus-router for AI coding agents. Watches Claude/Codex transcript JSONL to tell which agent is working vs awaiting you vs stuck, then raises the EXACT iTerm/Terminal/Ghostty window via osascript. SwiftBar ambient menu-bar surface + agentwatch stuck-overlay. STEAL->BUILT of erha19/ping-island.\n","mode":"On demand","kind":"cli","host":"This Mac","in":["nothing (reads a local folder + a local folder transcripts)"],"out":["attention board (working/awaiting-you/stuck per agent); `island raise` focuses the window; SwiftBar menu-bar title \ud83d\udd14N when an agent needs you"],"can":["which of my agents needs me right now","jump to the terminal of a waiting agent","ambient menu-bar surface for all my AI coding agents","raise the exact iTerm/Terminal/Ghostty window for a session","tell working vs awaiting-you vs stuck across Claude and Codex","which agent is stuck or dead","one-line agent-attention summary for throne/estate-digest"],"with":["agentwatch","aoe","agent-status","throne","cc-headless"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"commonly-pod","name":"Commonly Agent Pod (self-hosted prototype)","hall":"forge","group":"Agents & reasoning","cat":"agents/orchestration","what":"Self-hosted multi-runtime agent workspace (\"social kernel\") \u2014 humans, the local Claude Code CLI, and webhook bots share ONE pod with persistent memory; @mention an agent and its own runtime wakes and replies into the pod","mode":"Service","kind":"service","host":"This Mac","in":["text"],"out":["pod-messages","web-ui"],"can":["cross-runtime-agent-pod","agent-shared-memory","agent-chat-workspace","claude-cli-as-pod-agent","webhook-agent-scaffold","persistent-agent-team"],"with":["agentsview"],"cmd":"","url":"","state":"stopped","stateLabel":"Stopped","stateNote":""},{"id":"mlx-toolparse","name":"mlx-toolparse \u2014 Tool-Call Extraction Bank","hall":"forge","group":"Agents & reasoning","cat":"ai/inference","what":"Portable tool-call EXTRACTION library (STEAL from Rapid-MLX's tool_parsers) \u2014 turns raw local-model text into structured tool_calls across ~14 wire formats (Hermes/Qwen/Llama/Mistral/DeepSeek/GLM/Granite/Gemma4/Harmony/etc), 46 format labels, only dep is transformers. Closes the fusion-shim no-tool_calls gap WITHOUT running any engine \u2014 pipe a local model's reply through extract_tool_calls(text, fmt) and get an OpenAI/Anthropic-shaped tool call back. A library (import), not a service.","mode":"Reference","kind":"lib","host":"This Mac","in":["raw-model-text"],"out":["text/json (tools_called E deduplicated Finding schema tagged with OWASP Top 10 + CWE (DefectDojo dedup+SLA steal), then the supercharge no scanner does on its own: enriches every CVE with real-world exploitation signal \u2014 CISA KEV (actively-exploited catalog, keyless, 24h-cached) + EPSS (exploit probability, keyless) + optional darkintel deep pull \u2014 and ranks findings P0..P4 so you fix what is being weaponized first, each with a remediation SLA. Local-AI remediation brief via fusion-shim :8051 (no cloud). Light-mode HTML audit report for clients. Gate mode returns exit 2 to block a commit/CI. STEAL->BUILD of AgentSecOps/SecOpsAgentKit (skipped its offensive dual-use tools + NOASSERTION license; nothing vendored, ideas only). Built 2026-07-04.\n","mode":"On demand","kind":"cli","host":"This Mac","in":["path/dir","path/repo"],"out":["ranked findings table (P0..P4, OWASP/CWE, KEV/EPSS flags)","json/findings (--json)","html/audit-report (--html)"],"can":["security-scan","vulnerability-scan","cve-scan","dependency-scan","container-scan","iac-misconfig-scan","secret-scan","sbom-generate","exploit-aware-prioritization","kev-epss-enrichment"],"with":["darkintel","repo-doctor","injection-scan","agentspan","security-review"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"vulnclaw-x","name":"vulnclaw-x \u2014 local autonomous pentest agent (supercharge over VulnClaw)","hall":"keep","group":"Infrastructure & security","cat":"security","what":"Run a cloned VulnClaw (autonomous NL->pentest agent) 100% LOCAL via ollama, on a safe throwaway a private host CTF practice box, then enrich findings with exploit-aware CVE ranking. AUTHORIZED/CTF/local-lab ONLY \u2014 upstream authorization guardrails intact, never auto-targets third parties.","mode":"On demand","kind":"cli","host":"This Mac","in":["authorized target URL (local/lab), or a VulnClaw markdown report for enrich"],"out":["pentest report + P0-P4 ranked CVE intel; evidence-gated findings"],"can":["Autonomous recon->vuln->exploit->report loop against a local/authorized target","Enrich a report: CVE -> CISA KEV + EPSS + CVSS -> P0-P4 exploit-aware ranking","Evidence-gate a claimed flag/finding (rejected unless verbatim in captured output)","Safe self-demo via a local practice box (lab)"],"with":["darkintel","secscan","osintdesk","evidence_gate"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"agentid","name":"agentid \u2014 audit the browser identities your AGENTS own (webrecall sibling)","hall":"keep","group":"Infrastructure & security","cat":"security testing","what":"browser-harness does not drive your Chrome \u2014 it launches its own against a local folder, and that profile had 247 cookies (github, auth.openai.com, login.microsoftonline) while the human Chrome Default held 53. agentid inventories every agent-owned Chromium profile, ranks what each can reach (MONEY/INFRA/IDENTITY/AI/SOCIAL), and enforces an append-only grant ledger so an agent login is a recorded decision instead of silent accretion.","mode":"On demand","kind":"cli","host":"This Mac","in":["none for scan/drift; profile path + host for grant/revoke"],"out":["profiles ranked by reach, or ungranted/grandfathered logins; exit 2 gates CI"],"can":["list every agent-owned browser profile and what it is logged into","exit 2 when an AGENT identity reaches a bank, broker or payment host","drift: gated logins (MONEY/INFRA/IDENTITY) with no recorded decision","grant/revoke a login with a required reason, append-only at a local folder","stale: agent logins nobody has used in N days","separate Electron app containers (Claude/Codex) as the HUMAN's identity"],"with":["webrecall","agnixx","browser-harness","redactkit"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"disclosure-guard","name":"Disclosure Guard","hall":"keep","group":"Infrastructure & security","cat":"security testing","what":"Decides whether a sensitive payload may leave to cscan","repo-doctor","injection-scan"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"redactkit-sanitize-text","name":"redactkit sanitize-text","hall":"keep","group":"Infrastructure & security","cat":"security testing","what":"Deterministic Unicode/homoglyph watermark scrubber for TEXT - strips zero-width/format chars (incl. the Unicode Tag steganography block), exotic spaces, and opt-in Cyrillic/Greek homoglyphs. Verifiable scrub (asserts zero disallowed code points remain); dual-use as an injection-obfuscation cleaner (injection-scan.py --strip shares the predicate). Layer A steal from guillaumemeyer/watermarks-remover.","mode":"On demand","kind":"cli","host":"This Mac","in":["text or JSON file (or stdin)"],"out":["cleaned text (stdout) + removed-count report (stderr)"],"can":["strip zero-width / bidi / BOM / soft-hyphen and the Unicode Tag block","fold Cyrillic/Greek homoglyph lookalikes to ASCII (--homoglyphs, opt-in)","clean AI provenance marks from prose before pasting or sharing","injection-scan.py --strip cleans invisible chars from untrusted text"],"with":["injection-scan","huashu-proofreading","redactkit"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"airlock","name":"airlock","hall":"keep","group":"Infrastructure & security","cat":"security/sandbox","what":"Local-first hardened sandbox for untrusted / agent-generated code (ported from opensandbox-group/OpenSandbox; EXPLORE built on user override). Thin wrapper over the Docker/Colima CLI that runs code you don't trust yet \u2014 a freshly evaluated repo or AI-written code \u2014 in a kernel-isolated box. Ports three OpenSandbox deltas \u2014 sealed egress (--network none by default), ephemeral execution (read-only rootfs plus writable tmpfs /work, all caps dropped, mem/cpu/pids capped), and JIT credential injection (--secret K=V exists only for one exec, never baked into image or snapshot). run-repo one-time-copies an untrusted repo via tar-over-exec (no host mount, host filesystem invisible), runs it sealed, then auto-destroys the box. Kernel boundary is Colima's Linux VM plus dropped caps; add --runtime=runsc on a real Linux host for a gVisor syscall filter. Requires colima running.\n","mode":"On demand","kind":"cli","host":"This Mac","in":["path to an untrusted repo plus a shell command to run inside the sealed box"],"out":["the sealed command output; the box is auto-destroyed afterwards"],"can":["sandbox","run-untrusted-code","isolate-execution","sealed-execution","safe-repo-run"],"with":["evaluate"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"clawk","name":"clawk","hall":"keep","group":"Infrastructure & security","cat":"security/sandbox","what":"Per-agent DISPOSABLE Linux microVM for coding agents (Claude/Codex) \u2014 the hardened successor to airlock for genuinely untrusted or uncensored work. Third-party tool (clawkwork/clawk, Apache-2.0) evaluated EXPLORE, prototyped, and installed 2026-07-16 to a local folder (v0.2.0). Each sandbox gets its OWN Linux kernel via macOS Virtualization.framework (root inside the guest is harmless \u2014 the host filesystem was never mounted), plus a root-proof DNS-aware egress ALLOW-LIST enforced in a userspace L3 stack (gvproxy) outside the guest, so even root in the VM cannot add hosts. This is the boundary airlock (shared Colima kernel plus dropped caps) structurally cannot reach. Boots in ~18s off a cached rootfs. Denials are logged by the hostname the guest resolved (clawk network denials). Ticket mode gives one sandbox a git worktree per repo plus cross-linked PRs. Use it over airlock when the agent is genuinely untrusted, needs nested Docker/k8s, or must be network-fenced by hostname. Requires macOS 14+ Apple silicon.\n","mode":"On demand","kind":"cli","host":"This Mac","in":["a project directory (cwd mode) or a ticket template (ticket mode); optional per-host egress allow rules"],"out":["a disposable ac","in":["none","--limit","--since","--model"],"out":["markdown/digest","obsidian-note","telegram"],"can":["tech-trends","daily-digest","trend-aggregation","github-trending","hacker-news","product-hunt","news-summary","morning-digest","tech-newsletter","ai-summarized-feed"],"with":["secondbrain","wiki-ingest","horizon","defense-intel","supermodel"],"cmd":"","url":"","state":"responding","stateLabel":"Responding","stateNote":""},{"id":"understand-knowledge","name":"understand-knowledge \u2014 semantic knowledge-graph of a wiki / Obsidian vault","hall":"library","group":"Knowledge & learning","cat":"knowledge","what":"Turns a Karpathy-pattern LLM wiki (index.md + wikilinked .md \u2014 e.g. the Obsidian vault's wiki/ subdir) into an interactive force-directed knowledge graph. Beyond the wikilink graph, LLM article-analyzer agents extract the IMPLICIT structure the links never captured \u2014 entities, claims, and typed relationships (builds_on / contradicts / exemplifies / cites / authored_by). Sibling /understand-* skills do the same for codebases.","mode":"On demand","kind":"skill","host":"This Mac","in":["wiki-dir","knowledge-base","obsidian-vault"],"out":["knowledge-graph/json","web-ui"],"can":["knowledge-graph","wiki-graph","vault-graph","semantic-graph","entity-extraction","implicit-relationships","claim-extraction","contradiction-detection","knowledge-base-analysis","understand-knowledge"],"with":["wiki-ingest","wiki-query","secondbrain","brainmap","qmd"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"web-archive","name":"web-archive (live-site offline snapshotter)","hall":"library","group":"Knowledge & learning","cat":"knowledge","what":"Snapshot a LIVE webpage into ONE self-contained .html that opens forever offline \u2014 no network, no tracking, no JS. --render drives real Chrome to let a SPA finish building, then strips the JS, so React/Vue/Angular pages save faithfully instead of blank.","mode":"On demand","kind":"cl ed memory list","context pack","audit report","recall metrics"],"can":["search the auto-memory corpus lexically (bm25 over name+description+body)","pack memories into a token budget ranked by impact-per-token, freshest first","demote stale memories by memory TYPE (feedback rules survive a year, project notes rot in 45d)","find retired facts still asserted as live and suggest superseded_by targets","surface UNRESOLVED contradictions as a BLOCKING state (exit 2) when two live memories bind one anchor to different values and neither is retired","flag memories citing files or line ranges that no longer resolve","measure held-out recall honestly (R@1/R@5/R@10/MRR)","semantic search via local ollama embeddings, 32x-compressed binary vectors (opt-in)"],"with":["secondbrain","baton","handover","asv","wiki-query","cacheguard"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"memguard","name":"memguard (MEMORY.md write-authority boundary + compaction)","hall":"library","group":"Knowledge & learning","cat":"knowledge memory","what":"Partitions MEMORY.md by write authority. The operator-authored preamble above the '<!-- BASELINE END -->' marker is SHA-256 pinned; agents append pointer lines below it only. 'check' re-derives the hash and fails loud with [BASELINE TAMPERED] (rc=2) when the preamble was rewritten, closing the persisted-memory re-injection surface named in rules/security.md. 'compact' ages dated entries into MEMORY-ARCHIVE.md. Ported from ODS memory-shepherd; diverges by ageing rather than resetting, because our scratch region holds durable pointers, not disposable working notes.","mode":"On demand","kind":"cli","host":"This Mac","in":["none (operates on MEMORY.md)","--days N for compaction window"],"out":["baseline OK + scratch entry count","[BASELINE TAMPERED] with both hashes (rc=2)","list of aged entries"],"can":["verify the MEMORY.md operator preamble still matches its pinned SHA-256","detect a self-rewritten or poisoned memory baseline before a session ingests it","pin the current baseline as authoritative (deliberate operator action)","age memory index entries older than N days into MEMORY-ARCHIVE.md","preview every change as a dry-run before anything is written"],"with":["mem-recall","redactkit","agnixx"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"ra","name":"ra Reddit Answers","hall":"library","group":"Knowledge & learning","cat":"knowledge/answer-engine","what":"Local, free clone of Reddit's Answers product plus a self-feeding learning system. Ask a question, get one citation-bound answer grounded in real Reddit discussion (Bottom line / Consensus / Dissent / Caveats with permalinks). Reddit-primary source tiering with Google cross-check and optional Quora, weights auto-shift experiential vs factual. Reddit's JSON/browser/reader-proxy access is hard-blocked so ingestion goes through freeintel site:reddit.com. Synthesis is adaptive local-first with escalation to opus when evidence is thin. Automation: ra muse (21:00 curiosity engine, mines recent activity into Decision/Curiosity/Wildcard question-sparks) and ra queue (07:45 decision queue to Obsidian + Telegram).\n","mode":"On demand","kind":"cli","host":"This Mac","in":["natural language question"],"out":["cited answer text with Bottom line / Consensus / Dissent / Caveats"],"can":["reddit-answers","crowd-opinion-synthesis","lived-experience-qa","product-recommendation-crowdsourced","citation-bound-answer","curiosity-engine","decision-queue"],"with":["freeintel","secondbrain","gyan","supermodel","redteam","factcheck"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"diagen","name":"diagen (inline generative diagrams)","hall":"library","group":"Knowledge & learning","cat":"knowledge/explain","what":"Local-first LLM answer surface that renders diagrams AND DATA CHARTS LIVE INLINE (Mermaid / function-plot / SVG / JSXGraph / data charts + KaTeX math) inter gests with dedup guarantee","learn taste from likes; liking auto-follows the channel via RSS"],"with":["bookpie","videorecap","yt-watchlist","getvideo","freevideo","defense-intel"],"cmd":"","url":"","state":"responding","stateLabel":"Responding","stateNote":""},{"id":"agentmem-consolidate","name":"agentmem consolidate","hall":"library","group":"Knowledge & learning","cat":"knowledge/management","what":"4-tier memory consolidation + decay","mode":"On demand","kind":"cli","host":"This Mac","in":["see description"],"out":["see description"],"can":["consolidate memory","memory tiers","decay old memories"],"with":[],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"capability-cockpit","name":"Capability Cockpit","hall":"library","group":"Knowledge & learning","cat":"knowledge/management","what":"AI-fronted, evolving interface over the 170-capability registry \u2014 ask questions grounded in the whole catalog, get the EXACT launch command for any tool, see what composes together, get tool recommendations, live health dots, and absorb new tools. The conversational upgrade of the static capability mindmap.","mode":"Service","kind":"service","host":"This Mac","in":["natural-language-question","goal"],"out":["answer","launch-command","tool-ranking"],"can":["capability-search","launch-guidance","tool-recommendation","compose-graph","grounded-qa","self-improving-catalog"],"with":["genie","mix","macfind"],"cmd":"","url":"","state":"responding","stateLabel":"Responding","stateNote":""},{"id":"ce-compound","name":"ce-compound CLI","hall":"library","group":"Knowledge & learning","cat":"knowledge/management","what":"Session learnings extractor to secondbrain","mode":"On demand","kind":"cli","host":"This Mac","in":["see description"],"out":["see description"],"can":["compound learnings","session debrief","extract decisions"],"with":[],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"the-adversary","name":"The Adversary","hall":"library","group":"Knowledge & learning","cat":"knowledge/management","what":"Argues against every new memory/wiki entry before you save it, citing contradicting entries from your own corpus by slug, and returns a KEEP/REVISE/REJECT epistemic verdict. Never edits or deletes memory \u2014 advisory only. The second brain that argues back.","mode":"On demand","kind":"cli","host":"This Mac","in":["proposed-memory-entry"],"out":["counter-argument","keep-revise-reject-verdict"],"can":["memory-review","contradiction-detection","steelman-opposite","epistemic-gate"],"with":["mem-recall","vouch","calib-sentinel"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"book-acquisition","name":"Book acquisition","hall":"library","group":"Knowledge & learning","cat":"knowledge/reading","what":"Acquire books through BookPie/GetBooks and LazyLibrarian with a local qBittorrent client; verify files and distinguish pending downloads from completion.","mode":"On demand","kind":"cli","host":"This Mac","in":["title and author, or pending queue/status request"],"out":["verified book file or explicit pending/source status"],"can":["lazylibrarian","qbittorrent books","pending bookpie books","getbooks source","book download status","confirm book download complete"],"with":["bookpie","getbooks","bookhunter"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"bookhunter","name":"bookhunter","hall":"library","group":"Knowledge & learning","cat":"knowledge/reading","what":"Book-acquisition orchestrator \u2014 fans one request across three systems that never talked to each other: CWA's source_chain.py waterfall (Anna's/OpenLibrary/Gutenberg/Standard Ebooks/Internet Archive/Z-Library/LibGen/Welib, open-slum mirror-ranked), a live LazyLibrarian daemon (its own Anna's Archive scraper plus torrent/Usenet providers), and annas-mcp \u2014 stops at first ground-truth-verified success, always names which leg produced the file.","mode":"Service","kind":"cli","host":"This Mac","in":["a book title, optionally --author/--isbn/--out"],"out":["the acquired file's path on disk, and which leg (CWA/LazyLibrarian/annas-mcp) produced it"],"can":["download a book","find a book that other downloaders missed","acquire a book across multiple sources at once","search Anna's Archive, LazyLibrarian, and annas-mcp in one call"],"with":["bookpie","getbooks"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"bookpie","name":"bookpie","hall":"library","group":"Knowledge & learning","cat":"knowledge/reading","what":"Magpie-for-books \u2014 taste-ranked, grounded book discovery from Open Library subject feeds, served as a light-theme web shelf (:8795) and a Telegram bot (@Bookshop70_bot). Four tabs (Discover new picks, Selected acted-on, Explore running library of every book ever recommended, Search any book). Every card has like / dislike / seen / podcast / ebook actions. Tapping podcast acquires the book through the full getbooks chain (Anna's, Internet Archive/browser, GeoGuard), then builds an audio deep-dive (NotebookLM primary, local edge-tts fallback) and delivers it to AudioList. Self-heals the downloader, keeps a persistent retry queue, and learns taste from every rating.","mode":"On demand","kind":"cli","host":"This Mac","in":["a subject interest, a search query (title/author/ISBN/subject/idea), or nothing (uses saved subjects)"],"out":["web shelf of book cards + Telegram cards; on request an audio podcast delivered to AudioList"],"can":["book discovery","reading recommendations","search a book by title author isbn subject or idea","book to podcast","audio deep-dive of a book","ebook download","taste-learning reading feed"],"with":["getbooks","audiolist"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"pvrag","name":"PixelRAG Visual Document RAG (pvrag)","hall":"library","group":"Knowledge & learning","cat":"knowledge/retrieval","what":"Search PDFs/scans/screenshots by how they LOOK (visual embeddings), not parsed text \u2014 preserves tables, charts, layout, stamps, handwriting, and Devanagari that OCR/HTML-parse destroys. Also image-as-query forgery/authenticity check and give-Claude-eyes capture of any URL/PDF.","mode":"Service","kind":"cli","host":"This Mac","in":["pdf","image","screenshot","url","text-query"],"out":["ranked-tiles","answer-from-pixels","authenticity-verdict"],"can":["visual-document-search","search-scanned-pdf","search-tables-charts-layout","image-query","forgery-authenticity-check","screenshot-and-read","table-extraction-visual"],"with":["factcheck","financedeck","bidkit","govwatch","secondbrain","browser-harness"],"cmd":"","url":"","state":"stopped","stateLabel":"Stopped","stateNote":""},{"id":"gurukul","name":"gurukul (LEGACY 2026-06 engine, source lost; CLI now = gurukul-tutor; canon survives in tools/samadhan/canon) \u2014 Polymath learning operating system","hall":"library","group":"Knowledge & learning","cat":"learning/education","what":"Full 6-week (42-day) program building executive fluency across seven professions (MBBS, Engineering, MBA, CA, CFO, CTO, CEO) in parallel. Daily lecture + spaced-repetition snap-cards (SM-2) + application quiz with Elo-gated mastery + per-concept infographic + narrated explainer video + Obsidian vault + web cockpit. Two surfaces share one state at a local folder \u2014 the `gurukul` CLI AND an interactive Telegram bot @Gurukul70_bot (PM2 gurukul-bot). 42 concepts in canon/ (week1 at canon/*.json, week2-6 at canon/week<N>/*.json).","mode":"Scheduled task","kind":"cli","host":"This Mac","in":["program_day","field_slug"],"out":["terminal_lecture","telegram_bot","obsidian_note","web_cockpit","infographic_png","explainer_mp4"],"can":["learn-mental-models","daily-study-program","spaced-repetition","flashcard-review","adaptive-quiz","mastery-tracking","polymath-training","executive-fluency","study-curriculum","board-exam-prep"],"with":["lecture","xplain","design","toon","mem-recall","wiki-ingest","tg-send"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"gurukul-tutor","name":"Gurukul Tutor \u2014 zero-to-competent programmes, teach-first voice tutor","hall":"library","group":"Knowledge & learning","cat":"learning/education","what":"Voice tutor with full zero-to-competent PROGRAMMES. A newcomer gets a 5-part orientation (what the field is, its branches, what is covered, why this order, how it teaches), an intake (background, goal, hours per week), a personal timeline, then modules taught lesson-first and tested Socratically (never gives the answer; one unassisted explanation masters a skill), a roadmap with pace (ahead / on pace / behind), a welcome-back recap, and a capstone with direct feedback. Nine programmes built: mba, medicine, ca, cfo, cto, ceo, engineering, banned-knowledge, occult (10 modules each). Web tutor on :8975 (PM2 gurukul) and Telegram @Gurukul70_bot (PM2 gurukul-bot) share progress. `gurukul programme` builds a new field from faculty/experts/samizdat/tantu; `gurukul forge` builds a single course.","mode":"Service","kind":"pm2+cli","host":"This Mac","in":["a programme or course id, or any field/subject to build"],"out":["spoken orientation and lessons, Socratic testing, roadmap with pace, recap cards, capstone feedback"],"can":["take me from zero to competent in a field (MBA, medicine, CA, CFO, CTO, CEO, engineering, banned knowledge, occult)","orient me: what the field is, its branches, what we cover, in what order and why","set a personal study timeline and tell me if I am on pace","teach a lesson then test me without giving the answer","build a new programme or single course on any subject from our own libraries","tutor me on Telegram by text and voice note"],"with":["faculty","experts","samizdat","tantu","local-tts","fusion-shim","courseware-ingest"],"cmd":"","url":"","state":"responding","stateLabel":"Responding","stateNote":""},{"id":"lax","name":"lax \u2014 Learn-Anything eXtended (tutor supercharge bridge)","hall":"library","group":"Knowledge & learning","cat":"learning/education","what":"Wires the cloned learn-anything Socratic-tutor CLI into the local free stack. Grounds a learning explanation in REAL cited sources (freeintel free web + secondbrain local notes + YouTube-built experts, all injection-scanned as data), grades free-text answers with a local rubric, and bridges Gurukul progress into the learn-anything dashboard. Local-first, free, private; replaces learn-anything's Context7 doc-verification with free-search-first grounding.","mode":"On demand","kind":"cli","host":"This Mac","in":["concept_or_question","field_slug"],"out":["cited_sources_markdown","rubric_grade","learn_anything_topic_json"],"can":["ground-learning-in-sources","cited-concept-primer","free-text-answer-grading","learn-as-you-code","bridge-gurukul-dashboard"],"with":["gurukul","freeintel","secondbrain","experts"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"saakshi","name":"Saakshi cross-venue verifier","hall":"library","group":"Research & discovery","cat":"research","what":"Cross-venue statement verifier for named decision-makers: does what a CEO said in one interview contradict what they said in another? Downloads two+ talks of the SAME person, diarizes them, and runs an attribution gate (a clip counts only if it is a clean 2-speaker interview AND the guest is not being narrated about in the third person \u2014 news packages and panels are refused, never falsely pinned to the target). Then an NLI/entailment judge (local ollama, glm-4.7-flash) decides per cross-venue claim pair CONTRADICTION / ENTAILMENT / NEUTRAL, gated on min-content (4 distinct content words each side) and min-confidence (0.6). Per-speaker verdict: FLAGGED (self-contradiction \u2014 the money feature), CORROBORATED (consistent), or BLIND (insufficient overlap \u2014 silence is NOT vindication). Cosine similarity is dead as the checking unit (it encodes speaking register, not proposition) and survives only as an adversarial probe that MUST return NEUTRAL on cross-speaker high-cosine pairs. All fetched transcript text is DATA.","mode":"On demand","kind":"cli","host":"This Mac","in":["public interview URLs (--speaker/--venue/--date per clip); a local folder state"],"out":["a local folder + rich-markdown per-speaker verdict"],"can":["download two+ interviews of the same named person and diarize each into interviewer/guest turns","refuse to attribute a clip to the target unless it is a clean 2-speaker interview (bouncer gate)","judge every cross-venue claim pair for self-contradiction with a local NLI judge, content+confidence gated","emit a per-speaker FLAGGED / CORROBORATED / BLIND verdict with both contradicting sentences printed"],"with":["honesty","nidhi","chetna","darkintel"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"storm-quick","name":"STORM Quick Mode \u2014 5-Persona Research Fast Path","hall":"library","group":"Research & discovery","cat":"research","what":"10-second 5-perspective breakdown on any topic via Academic / Skeptic / Economist / Historian / Practitioner personas. Each returns: core position (2 sentences), strongest evidence, and the one thing no other perspective would say. Skips full STORM pipeline (no search, no outline, no article gen). Persists to DB \u2014 storm_get_research still works.\n","mode":"Service","kind":"mcp","host":"This Mac","in":["topic-string"],"out":["5-persona-breakdown","article-field"],"can":["quick-research","5-persona","multi-perspective-quick","economist-lens","historian-lens","research-snapshot","fast-brief","incentive-mapping","precedent-check"],"with":["crucible","storm-mcp","defense-intel","wiki-ingest"],"cmd":"","url":"","state":"stopped","stateLabel":"Stopped","stateNote":""},{"id":"aeo","name":"AEO Auditor","hall":"library","group":"Research & discovery","cat":"research analysis","what":"Answer Engine Optimization auditor: scores a web page 0-100 on how likely an AI answer engine (ChatGPT/Claude/Perplexity/Google AI Overviews) is to CITE it. 7 deterministic factors read off the served HTML (AI-crawler robots access, JSON-LD, answer-shaped content, fact specificity, chunk independence, entity clarity, freshness) + optional --llm simulated citation test via local fusion-shim. JS-only page = DEGRADED, never a fabricated score. A sellable audit service; first venture/revenue-lens capability.","mode":"On demand","kind":"cli","host":"This Mac","in":["a URL (+ optional query for the --llm citation test)"],"out":["0-100 citability score, per-factor findings, optional HTML report; exit 0/1/2/3"],"can":["score any URL's AI-answer-engine citability 0-100 with a per-factor breakdown","check robots.txt for GPTBot/ClaudeBot/PerplexityBot/Google-Extended access","run a local-model simulated 'would an answer engine cite this for query Q' test","emit a client-ready light-theme HTML audit report","report DEGRADED (never a low score) when a JS-only page can't be read"],"with":["seo","yashas","srijanway","teardown"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"factcheck","name":"Fact Check","hall":"library","group":"Research & discovery","cat":"research analysis","what":"Verify any claim, link, tweet/X post, WhatsApp/Telegram forward, or screenshot against tier-ranked authoritative sources. Decomposes into atomic claims, free-searches each, classifies sources T1 (gov/wires/peer-reviewed) \u2192 T4 (social/blogs), mechanically grounds quotes, and returns a TRUE/MISLEADING/UNVERIFIED/FALSE verdict with evidence links.","mode":"On demand","kind":"skill","host":"This Mac","in":["text","url","image","topic"],"out":["verdict","analysis","evidence-list"],"can":["fact-check","verify-claim","debunk","is-this-true","is-this-real","misinformation-check","source-verification","quote-grounding","hoax-check","forward-check"],"with":["defense-intel","deep-research","ocr","freeintel","wiki-ingest","gyan"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"freeintel-search","name":"FreeIntel Web Search","hall":"library","group":"Research & discovery","cat":"research analysis","what":"Free-first web search backbone enforcing the \"Free Search First\" policy. One query runs a keyless fallback chain and returns the first hit. NOW LED BY SELF-HOSTED SEARXNG (keyless, unlimited, private meta-search over 70+ engines) so Google/Bing never see who's asking and the keyed providers' quotas stay in reserve. Fail-safe \u2014 any provider down is skipped transparently (SearxNG down \u2192 falls straight to DuckDuckGo, zero regression). It is the substrate the research/answer tools (ra, gyan, factcheck, research-pipeline, dhara) build on.","mode":"On demand","kind":"cli","host":"This Mac","in":["query"],"out":["results","provider","latency_ms"],"can":["web-search","search-the-web","free-search","free-web-search","private-search","no-api-key-search","keyless-search","searxng","meta-search","anonymous-web-search"],"with":["ra","gyan","factcheck","research-pipeline","defense-intel","wiki-ingest"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"hnpress","name":"hnpress \u2014 Front Page Weather (Hacker News visual desk)","hall":"library","group":"Research & discovery","cat":"research analysis","what":"Hacker News as a visual reading desk: keyless hn.algolia.com pool (front page + last 48 h > 20 pts, ~170 stories), light-theme treemap (area=points, colour=topic, orange ring=heated), argument heat bars, scroll-loading feed with top comments quoted, topics by a LOCAL ollama model (gemma, temp 0, keyword fallback marked kw), and per-story context lenses for the top N from ra (Reddit), chetna (corpus, coverage-gated) and mem-recall (notes) with OK/THIN/NOT RUN/TAINTED/ERROR badges","mode":"On demand","kind":"cli","host":"This Mac","in":["none (live HN API); flags --hours --pool --context N --fast --out"],"out":["self-contained light-theme HTML (a local folder) or --json rows; publish via Artifact"],"can":["hn-front-page-treemap","hn-story-pool-48h","local-topic-classification","argument-heat-ranking","top-comment-quoting","estate-context-lenses","honest-lens-badges"],"with":["ra","chetna","mem-recall","ocx","throne"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"hyperextract","name":"hyperextract","hall":"library","group":"Research & discovery","cat":"research analysis","what":"Turn a document into a typed knowledge graph/HYPERGRAPH via a local LLM \u2014 n-ary relation extraction (one hyperedge links ALL participants of an event, not just two). EXPLORE-grade.","mode":"On demand","kind":"bash","host":"This Mac","in":["a document (PDF/Word/text) + a configured local LLM+embedder seat"],"out":["a typed knowledge graph/hypergraph store; semantic-search answers as structured events"],"can":["extract a graph or n-ary hypergraph from PDF/Word/text (nine typed structures)","model a tender/event as ONE hyperedge holding buyer+item+location+scheme+dates (verified arity=7 on a DRDO tender)","semantic search / chat over extracted knowledge (Hyper-RAG)","run 100% local (ollama/vLLM seat + embedder), no cloud","the n-ary gap kautilya/samasya/CPPP tenders flatten into binary org->topic edges"],"with":["kautilya (the binary power graph this would enrich)","chetna (tender/news corpus source text)","s00958 vLLM seat (needed for fast batch extraction)"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"kathan","name":"Kathan Corpus Distillery","hall":"library","group":"Research & discovery","cat":"research analysis","what":"Turn one author's archived posts (dated-text JSON) into a tiered, citation-grounded handbook with mechanism cards, then audit the speaker for cross-time self-contradiction (FLAGGED/CORROBORATED/BLIND, saakshi semantics) via local ollama NLI.","mode":"On demand","kind":"cli","host":"This Mac","in":["corpus.json"],"out":["handbook.md","audit.md"],"can":["distill-corpus","build-handbook","mechanism-cards","tier-tweets","self-consistency-audit","guru-contradiction-check"],"with":["secondbrain","saakshi","experts"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"mcx-defense-radar","name":"MCX Defense-Procurement Correlation Radar","hall":"library","group":"Research & discovery","cat":"research analysis","what":"Research tool testing whether a defense-tender-intensity index is a lagged feature for crude-oil regime detection \u2014 a signal only someone owning both corpora could test. Anti-p-hacking is the deliverable: pre-registered lags, Bonferroni correction, walk-forward out-of-sample, and refusal to report an in-sample-only signal. Emits SIGNAL/NO-SIGNAL/INSUFFICIENT-DATA. Never emits trade advice.","mode":"On demand","kind":"cli","host":"This Mac","in":["tender-corpus","regime-series"],"out":["correlation-verdict","html-report"],"can":["tender-intensity-index","lagged-correlation","anti-p-hacking-test","walk-forward-validation"],"with":["regime-court","defense-intel","forecast-tourney"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"mes-journal","name":"MES & DWP Notes Journal","hall":"library","group":"Research & discovery","cat":"research analysis","what":"Append a Military Engineer Services / Defence Works Procedure Q&A as a numbered, dated entry to a living notes journal and auto-render a styled A4 PDF reference.","mode":"On demand","kind":"cli","host":"This Mac","in":["text","markdown"],"out":["pdf"],"can":["mes-journal","defence-works-procedure","dwp","mes-notes","journal-append","knowledge-journal","pdf-journal","military-engineering-services"],"with":["livebook","wiki-ingest","defense-intel","design","factcheck"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"ocx","name":"ocx \u2014 cheap web read (only-cli/oc supercharge)","hall":"library","group":"Research & discovery","cat":"research analysis","what":"Estate supercharge over only-cli/oc (vendored): turns a web page into a ~500-token numbered card browserlessly via curl-impersonate (142x fewer tokens than raw HTML, gets past Reddit/LinkedIn/DDG blocks). Adds the estate safety layer: every read injection-scanned with honest verdicts (clean/tainted/empty/error/degraded \u2014 degraded!=absent), a weave cheap-first ladder that escalates to browser-harness ONLY when oc reports empty, secondbrain capture, optional local-LLM summarize (fusion-shim :8051), and 6 estate JSON-API doors oc lacks (arxiv/pypi/npmjs/crossref/openalex/hnsearch/openlibrary/gutenberg, JSON-as-page compressed). The openlibrary/gutenberg doors feed a cheap legal-source pre-check wired into /getbooks step 2 (confirms a public-domain download exists before the heavier Shelfmark waterfall runs).","mode":"On demand","kind":"cli","host":"This Mac","in":["a URL, a site shortcut (oc/ocx door), or a search query"],"out":["numbered ~500-token page view + honest verdict tag; --json for machines"],"can":["read a web page cheaply as a ~500-token numbered card","search the web then read the top hits cheaply (ocx search --read)","escalate to a real browser only when a page is JS-only/blank (ocx ladder)","hit keyless research/dev APIs as tidy numbered lists (arxiv/pypi/openalex/openlibrary/gutenberg)","capture a page into secondbrain / summarize it with a local model"],"with":["browser-harness","freeintel","secondbrain","weave","fusion-shim"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"parampara","name":"Parampara (research_analysis)","hall":"library","group":"Research & discovery","cat":"research analysis","what":"capability arbitrage scout \u2014 Wednesday 06:30 scan of new AI models/tooling (freeintel, injection-scanned) mapped against the estate's 50-tool coverage; classifies OWNED/GAP/UPGRADE and issues 3 cited build-this-now timing calls before the spread closes","mode":"On demand","kind":"cli","host":"This Mac","in":["see subcommands"],"out":["light HTML + state in a local folder (+ Telegram where specced)"],"can":["parampara","what should I build next","capability gap","timing arbitrage","new tools this week","build this now"],"with":["/evaluate","magpie"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"patents","name":"patents - keyless patent corpus search + novelty","hall":"library","group":"Research & discovery","cat":"research analysis","what":"Keyless patent search, record fetch and novelty check over the real patent corpus (Google Patents XHR): publication number, assignee, inventor, priority/filing/grant dates, per-jurisdiction legal status and full claim text. Splits absent (corpus really empty) from degraded (corpus unreadable) so a novelty verdict is never drawn from silence.","mode":"On demand","kind":"cli","host":"This Mac","in":["a concept/query string, or a publication number for fetch"],"out":["ranked records + total; or one record with claims; or a novelty verdict"],"can":["search patents with assignee/inventor/country/date/status filters","fetch one record including full legal claims","novelty check: clear / thin / crowded / unknown prior-art density","report corpus-wide match total, the honest novelty signal","per-jurisdiction legal status (US:ACTIVE, CN:ACTIVE, ...)"],"with":["manthan","samasya","di","labbench","bidkit"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"pinsight","name":"Pinsight \u2014 Pinterest deep search","hall":"library","group":"Research & discovery","cat":"research analysis","what":"Deep Pinterest search for any idea: fans across 6 facet lens queries via browser-harness XHR replay, dedupes repins by pin-id + image signature, enriches top pins with real save counts, rates 0-100 (saves/relevance/cross-lens centrality/richness), renders filterable light-theme HTML board + optional PDF in a local folder","mode":"On demand","kind":"cli","host":"This Mac","in":["idea text"],"out":["HTML board + PDF in a local folder"],"can":["pinterest deep search on any idea","moodboard / visual inspiration board","dedupe + rate + categorize pins with filters","top-picks PDF for sharing"],"with":["browser-harness","design","xgen"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"reach","name":"reach","hall":"library","group":"Research & discovery","cat":"research analysis","what":"Unified content-channel layer: one CLI to read/route across web, YouTube, GitHub, Reddit, Twitter/X, RSS, search and the local index via ranked-fallback backends, with a doctor that health-checks every channel. Stolen routing pattern from Agent-Reach, wired to the estate's own readers (ocx/yt-dlp/gh/ra/defuddle).","mode":"On demand","kind":"cli","host":"This Mac","in":["a URL, or nothing (doctor/weather)"],"out":["content text / traffic-light health table / readiness screen"],"can":["reach doctor [--live] [--json] \u2014 traffic-light health of 8 content channels + fix hints","reach read <url> \u2014 auto-detect platform, ranked-fallback read (first-that-works)","reach channels \u2014 backend fallback-order cheat-sheet","reach weather \u2014 channels + model quota + free-model count in one screen"],"with":["ocx","quotabar","freecatalog","getvideo","ra"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"teardown","name":"teardown \u2014 product reverse-engineering as a system","hall":"library","group":"Research & discovery","cat":"research analysis","what":"Takes a shipped product apart as a machine rather than a feature list. Fetches the product's own pages (homepage/pricing/about/changelog), harvests an og:image tour gallery, optionally grounds friction in real Reddit complaints via `ra`, then runs six single-responsibility inference passes over fusion-shim :8051 to produce the 15-section teardown \u2014 JTBD, the Trigger-Action-Reward-Return loop, a five-item copyable craft pattern language, competitor matrix, INFERRED metrics (north star / guardrail / the blindspot they refuse to measure), risk matrix and verdict \u2014 rendered into a light-theme print-ready HTML report. Every ungrounded claim is stamped [inferred]; unfilled fields render as an orange [needs input] chip, never a silent blank.","mode":"On demand","kind":"cli","host":"This Mac","in":["product name + homepage URL, or a local evidence file (--brief), or one of our own tool dirs"],"out":["light-theme HTML report (a local folder), SQLite corpus a local folder, optional Obsidian note"],"can":["full product teardown with evidence fetch (teardown run <product> --url <site>)","self-teardown of OUR OWN tools, same brutal questions (teardown self <tool>)","cross-product craft pattern library for copying into new builds (teardown patterns --json)","head-to-head comparison on loop/north-star/guardrail/blindspot/moat (teardown compare a b)","client-safe deliverable that never touches the private index (--client)"],"with":["evaluate","design","impeccable","ra","secondbrain","crucible","samasya","defence-innovator"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"labbench","name":"labbench (pre-registered scientific workbench)","hall":"library","group":"Research & discovery","cat":"research science","what":"Run a claim as a real experiment instead of a script. The hypothesis, metric, direction and pass-threshold are hashed and FROZEN before any data is touched; the runner refuses to score an unregistered experiment. A known-answer oracle runs first and BLOCKS the real run when the pipeline cannot reproduce a value it already knows. Every write is a hash-chained provenance line, so an edited or deleted record is detectable. A citation audit checks each number in a draft against our OWN run records - catching write-up drift from the recorded metric - alongside live DOI/arXiv/PMID resolution. Scholarly citation-graph connectors walk references backward and citations forward, the gap freeintel/tavily/STORM never covered (they search, they do not traverse).","mode":"On demand","kind":"cli","host":"This Mac","in":["a hypothesis, a metric, a threshold and a script that prints 'LABBENCH_METRIC: <float>'","a draft file for `labbench audit`","a DOI / arXiv id / PMID / topic for `labbench lit`"],"out":["pass / fail / blocked / error verdict against the pre-registered rule","light-theme HTML report with honesty banners above the result","citation audit with dead anchors and prose-vs-run mismatches","provenance chain verdict"],"can":["freeze a hypothesis, metric and threshold before measuring anything","block a run whose known-answer oracle does not reproduce","record a post-hoc threshold change as a stamped amendment","re-judge past runs under the current rule and flag any verdict that would flip","detect a tampered or deleted provenance record","refuse a clean exit that emitted no metric (silent success is an error, not a pass)","audit every number in a draft against its cited run or DOI","flag a citation count that carries no DOI, arXiv id or PMID as fabricated (exit 2) - the signature of a bibliography recalled from an LLM's weights","resolve a DOI, arXiv id or PMID and report dead anchors","walk a paper's references backward and its citations forward"],"with":["factcheck","research-pipeline","autoresearch","arena","loopdoctor"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"labbench-eo","name":"labbench EO agent-eval pack (GeoLLM-QA-shaped)","hall":"library","group":"Research & discovery","cat":"research science","what":"Score an agent that drives EO/GIS tools over multi-step geospatial tasks. For each task the agent emits an ordered tool-call trajectory; a task scores 1 only if it EXACTLY matches the reference (order-sensitive), metric = matches/tasks (sequence accuracy). labbench oracle-gates the grader first - it must reproduce a known 0.75 - so a broken scorer BLOCKS the run instead of returning a believable 0. The agent-under-test is pluggable: a real LLM via fusion-shim :8051, a keyword heuristic, a reference upper bound, or a noop lower bound. Tasks are hand-authored GeoLLM-QA-shaped demonstrators (arXiv:2405.00709 released no data); drop the real corpus into the same JSON schema if it ever ships.","mode":"On demand","kind":"bash","host":"This Mac","in":["NL geospatial task + toolbox (geollmqa_tasks.json)"],"out":["sequence-accuracy metric + labbench verdict (pass/fail/BLOCKED)"],"can":["score an EO/GIS agent by ordered tool-call sequence accuracy","drive a real LLM as the agent-under-test via fusion-shim :8051","oracle-gate the grader (known 0.75) before trusting any score","block the run when the grader cannot reproduce (exit 3)","compare heuristic / reference / noop / real-LLM agents on one corpus"],"with":["labbench","netra","assay"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"nidhi","name":"nidhi (knowledge-treasure nugget ledger)","hall":"library","group":"Research & discovery","cat":"research science","what":"Persistent fact-shaped research ledger sitting above the run-shaped producers (chetna/pragya/manthan/teardown). Each nugget must earn a 4-field taxonomy (mechanism / marginal constraint / telemetry signals / edge holder - the \"There Is No Oil Price\" bar, DB-enforced so a news summary cannot masquerade as a nugget). Nightly re-research on per-rhythm alarms (telemetry 7d / programme 21d / institutional 45d; quiet widens x1.6, could-not-check NEVER widens), chetna corpus tripwires pull reviews forward, claims diff by set algebra (LLM never asserts what changed). Autonomous: intake self-adopts, contradictions self-settle by deterministic evidence weight into a decisions journal; nidhi resolve overrides. drift/anima mood sets nightly budget; discoveries resonate back. Live treasure page + zero-friction capture (:8953/note), 3x/day spark reminders via Telegram + Mac, ideas.json feeds bhor + jigyasa, diffs fold into throne 08:20.","mode":"Service","kind":"bash","host":"This Mac","in":["thought / idea / news thread / pragya-chetna intake"],"out":["researched nuggets, live treasure page :8953, throne brief lines, ideas.json feed"],"can":["capture a thought frictionlessly (web pad, TG reply/voice, nidhi note)","research nuggets nightly and surface only what CHANGED","enforce mechanism/constraint/telemetry/edge before calling anything a nugget","self-settle contradictions by evidence weight, journaled, human-overridable","self-tune review cadence and rewrite dead queries within bounds","sync bhor gallery + jigyasa board from the live ideas feed","escalate structural changes (mechanism/constraint/contradiction) to pragya deep research, 1/cycle","start adopted pragya/manthan seeds warm from their own dossiers"],"with":["chetna","pragya","manthan","antar","bhor","jigyasa","throne"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"pragya","name":"pragya (thinking-research oracle)","hall":"library","group":"Research & discovery","cat":"research science","what":"Front door for ANY research utterance. Classifies the input (company/product/idea/opportunity/question/topic + defence/india flags), aims the right lenses from the existing fleet in parallel (recall=secondbrain+mem-recall, web/players=freeintel, crowd=ra, patents novelty, papers=labbench lit, teardown on deep tier, defence-bridge proposing di/samasya/manthan handoffs), then synthesizes a citation-bound dossier: refined framing, landscape and players, gap map, novelty read, 3 development concepts each with its riskiest assumption, what to research next. Light HTML dossier + honesty ledger in a local folder","mode":"On demand","kind":"bash","host":"This Mac","in":["any utterance: company, product, idea, opportunity, question"],"out":["cited dossier (stdout + light HTML) + honesty ledger"],"can":["classify any utterance and pick the right research pipeline","run fleet lenses in parallel with honest NOT_RUN degradation","injection-scan ALL lens evidence and quarantine TAINTED text","gap map + novelty read + 3 concepts with riskiest assumptions","propose di/samasya/manthan handoffs for defence-relevant input","warn when synthesis grounding is below 2 distinct citations"],"with":["teardown","manthan","di","samasya","ra","patents","labbench"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"cfbook-download","name":"cfbook-download \u2014 Cloudflare-walled book download (welib via FlareSolverr)","hall":"library","group":"Research & discovery","cat":"research/acquisition","what":"Download books from Cloudflare-protected sources (welib, Anna's Archive mirrors) that getbooks/Shelfmark can't reach. Solves the CF \"Just a moment\" challenge via FlareSolverr, extracts welib /md5/ hashes, and fast-fetches through the local CWA downloader's direct_download source. Includes ISBN-bypass for the Open Library metadata gate.","mode":"Service","kind":"service","host":"This Mac","in":["book_title","isbn","author"],"out":["epub","pdf"],"can":["download-cf-walled-book","welib-download","annas-archive-direct","cloudflare-bypass-book","isbn-book-lookup","getbooks-fallback"],"with":["getbooks","getmagazines","audiobookforge","research-pipeline"],"cmd":"","url":"","state":"stopped","stateLabel":"Stopped","stateNote":""},{"id":"reprokit","name":"Reproducible-Research Toolkit","hall":"library","group":"Research & discovery","cat":"research/quality","what":"Make research provable \u2014 provenance append-log (record/recover/forensics/replay every artifact write with model+run attribution), citation auditor (flag unsourced numbers, resolve DOI/arXiv/PubMed, detect stale figures), a pre-synthesis evidence source-map (tag every draft claim original/chart_formula/code_result/inference/recommendation and flag factual claims with no source anchor), and a client-facing light-mode audit report. Stdlib-only, local-first.","mode":"On demand","kind":"unknown","host":"This Mac","in":["manuscript-file","artifact-dir"],"out":["text/verdict","html/report"],"can":["provenance-log","recover-artifact-version","which-model-wrote-this","cite-audit","evidence-source-map","anti-hallucination-draft-check","research-audit-report"],"with":["research-pipeline","factcheck","reprokit-scitools","latex-document-skill"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"reprokit-scitools","name":"Scientific Calculator (signal + optics)","hall":"library","group":"Research & discovery","cat":"research/science","what":"Stdlib-only scientific computing \u2014 signal processing (pure-Python radix-2 FFT spectral peak, single-pole & moving-average filters, sine generator) and 14 closed-form photonics/fiber-sensing formulas (dBm<->mW, fiber loss, numerical aperture, V-number & mode count, Bragg/FBG wavelength & shift, Fresnel reflection, Rayleigh range, Snell & critical angle, OSNR). No MATLAB/Octave/scipy needed; an Octave bridge degrades to an install hint when absent.","mode":"On demand","kind":"unknown","host":"This Mac","in":["signal-samples","formula-params"],"out":["text/verdict"],"can":["fft-spectral-analysis","signal-filtering","optics-photonics-calc","fiber-sensing-math","fbg-bragg-wavelength","numerical-aperture","matlab-octave-bridge"],"with":["reprokit","drawio-skill","latex-document-skill"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"sparseinv","name":"sparseinv \u2014 sparse-inverse PINN engine","hall":"library","group":"Research & discovery","cat":"research/science","what":"Recovers an UNOBSERVED source field from a handful of scattered point measurements, by training a neural network whose loss includes the governing physics (a diffusion PDE evaluated with torch autograd), not just the data. Answers inverse questions like 'how much water is being pumped unreported, given twelve well readings' or 'how much is leaking, given a few detector traces'. Honest by construction: every fit holds out whole STATIONS (never random rows) and reports that holdout error with every prediction; keeps the best checkpoint by holdout rather than the final epoch and reports the U-shaped overfitting curve when it happens; every prediction carries required within_spatial_domain and is_temporal_extrapolation flags; and a cross-seed stability measurement WITHHOLDS any answer that does not survive re-fitting from new seeds.","mode":"On demand","kind":"cli","host":"This Mac","in":["nothing (labelled synthetic demo data), or a CSV of real observations with columns station,lon,lat,date,level_m"],"out":["recovered source magnitude with units, holdout relative-L2 error, best-epoch fraction and overfitting verdict, per-point predictions stamped with extrapolation flags, a stability verdict that may withhold the answer, and optional JSON"],"can":["recover an unreported groundwater extraction rate from sparse well levels","estimate a chemical/radiological release rate from sparse detector readings","validate a physics solver against closed-form analytical truth before use","measure whether a recovered field is identifiable or just seed-dependent","flag predictions that are spatial or temporal extrapolations","detect U-shaped overfitting that training loss does not reveal"],"with":["smoke-provider","samasya-kosh","defence-innovator","drishti"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"fastcrw","name":"fastCRW (local Firecrawl/Tavily)","hall":"library","group":"Research & discovery","cat":"search scrape","what":"Self-hosted, keyless, quota-free web scraper + crawler + search API (Rust, Firecrawl/Tavily alternative). Runs as a local Docker stack on :3111 with a bundled SearXNG + LightPanda\u2192Chrome rendering ladder + local-LLM structured extraction (ollama, no cloud key). Firecrawl /v2 wire-compatible, so the `firecrawl` CLI shim resurrects every firecrawl-* skill for free.","mode":"On demand","kind":"cli","host":"This Mac","in":["A URL (scrape/map/crawl/extract) or a query string (search)"],"out":["Markdown / JSON (structured fields) / list of URLs"],"can":["Scrape any URL to clean markdown/HTML/JSON with no per-call cost or key","Crawl a whole site (async BFS) and diff pages for change-tracking","Map all URLs on a domain in one call","Keyless meta-search via bundled SearXNG (70+ engines)","Structured field extraction via a local LLM (ollama, private, no cloud key)"],"with":["freeintel","research-pipeline","indiawatch","govwatch","pixelrag"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"obscura","name":"Obscura Featherweight JS-Scraper","hall":"library","group":"Research & discovery","cat":"web/scraping","what":"~64MB Rust headless engine that runs page JavaScript in V8 and returns HTML/text/markdown WITHOUT rendering pixels. The missing tier between static fetch (no JS) and full Chrome (200MB) \u2014 for pages that need JS executed but not screenshots, especially live gov/tender portals that ship an empty nav-shell and build content with JS. Ported from h4ckf0r0day/obscura (16.6k stars, Apache-2.0). Sibling steal \u2014 its wreq TLS-impersonation became curl_cffi in govwatch fetchers.","mode":"On demand","kind":"cli","host":"This Mac","in":["url","css-selector","js-expression"],"out":["html","text","markdown","links","json"],"can":["render-js-page","scrape-js-rendered","parallel-scrape","headless-without-chrome","page-js-eval","html-to-markdown","cdp-server","nav-shell-portal"],"with":["govwatch","tenderwatch","freeintel","browser-harness","stealthbrowser"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"vmic","name":"vmic \u2014 virtual microphone bridge","hall":"sound","group":"Audio & voice","cat":"media audio","what":"Speaks synthes
