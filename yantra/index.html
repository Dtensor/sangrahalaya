type). Coordinates are stored normalized 0..1 so they survive a re-render at another resolution. Refuses rather than guessing: a shape with no comment, a zero-byte render, a manifest naming a missing slide, or an out-of-range slide index all fail loud. Every mark is kept forever in <deck>/.markmode/ with clean + marked PNGs, the request, and an append-only history.jsonl.","mode":"On demand","kind":"cli","host":"This Mac","in":["an HTML slide deck (index.html with DECK_MANIFEST, or a deck-stage file) plus a slide number"],"out":["clean + marked PNGs, an EDIT-ONLY markdown request scoped to one slide file, append-only history.jsonl"],"can":["list every addressable slide in a deck with its number and source file","screenshot one slide at full deck resolution","let a human draw marks on that screenshot and comment each one","emit an EDIT-ONLY edit request scoped to a single slide file","re-render one slide to verify a fix landed","show the full annotation history for a deck"],"with":["design","deckgate","lecturecast","vra","qa-loop"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"slidemaker","name":"slidemaker (native-editable PPTX deck factory + universal deck linter)","hall":"studio","group":"Visual & creative","cat":"design creative","what":"Turns papers/repos/docs/dossiers into a NATIVELY EDITABLE .pptx (real text boxes, native PowerPoint charts, native math) via the vendored slide-maker skill, with a never-invent source gate and an independent critic+arbiter review before delivery. The supercharge half is a CLI: lint ANY .pptx whoever built it, fleet-lint a whole tree ranked by severity, generate slide art LOCALLY via xgen (free, private) behind an OCR text gate, and turn a dossier into a source-traced deck brief.","mode":"On demand","kind":"cli","host":"This Mac","in":["a .pptx, a source folder/paper/repo, or a dossier path"],"out":["editable .pptx \u00b7 lint findings \u00b7 rendered PNGs \u00b7 deck-brief.md \u00b7 local slide plates"],"can":["build an editable board/committee-grade PPTX from real source material","lint any existing .pptx for overflow/overlap/text-wall/small-type/layout-sameness","fleet-lint every deck in a directory, worst first","render a deck to PNGs via LibreOffice","generate text-free slide plates locally (no API key, OCR-gated)","export speaker notes as a spoken script","turn a manthan/di/samasya/chetna dossier into a deck brief"],"with":["deckgate","officecli","xgen","lecturecast","manthan","honesty","verify-live"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"batched-parts","name":"batched-parts \u2014 GPU-state-texture batching for Three.js","hall":"studio","group":"Visual & creative","cat":"design visual","what":"batched-parts: GPU-state-texture batching for high-part-count Three.js scenes (STEAL of the per-instance state-texture technique from ashemag/human-atlas). Merge parts into ONE draw call per group, then store each part's live state -- translation offset, visibility, selection -- in a DataTexture the shader reads via a partIndex vertex attribute. Renders thousands of individually selectable / hideable / animatable parts (exploded diagrams, instanced assemblies, swarms) with draw calls counted per GROUP, not per part. Moving/hiding/selecting a part is a one-texel write, not a scene-graph mutation. Reusable class 3d-models/tools/batched-parts.js; demo batched-parts-demo.html (512 parts -> 6 draw calls, headless-verified via shoot.py). The scaling successor to model3d's one-mesh-per-part approach once a build crosses ~hundreds of parts.","mode":"Service","kind":"http","host":"This Mac","in":["array of {geometry, group} parts"],"out":["threejs-batched-meshes","html"],"can":["high-part-count-threejs-batching","thousands-selectable-meshes","exploded-3d-view","per-part-visibility-selection-via-texture","draw-call-ceiling-fix"],"with":["model3d","img2threejs","figcheck","artifact"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"cadkit","name":"cadkit \u2014 CAD generation + geometry honesty gate","hall":"studio","group":"Visual & creative","cat":"design visual","what":"Turns natural language into a real parametric CAD solid (STEP) via build123d, then makes that geometry ACCOUNTABLE: a solid-integrity gate that reads the B-rep rather than a render, a declared-vs-measured reconcile against the spec that asked for the part, and a blast-radius tier ladder in front of anything that moves a physical machine. Wraps earthtojake/text-to-cad (MIT, pinned 4fd71ea / v0.3.13) in its own python3.12 venv.","mode":"On demand","kind":"unknown","host":"This Mac","in":["a natural-language part description, or an existing .step/.stp/.stl/.brep file"],"out":["STEP solid plus findings; gate exits 0 pass, 1 warn, 2 hard, 3 could-not-check (never a pass)"],"can":["make - natural language to build123d to a validated STEP, auto-retried with the failure fed back","gate - closed-manifold, naked-edge, non-manifold, zero-volume and extra-solid audit from the TOPOLOGY, catching what no snapshot can show (an open shell shades closed in every viewer)","reconcile - declared-vs-measured, because a part that renders perfectly can be the wrong size; a spec topic the parser could not read reports NOT CHECKED and is never folded into a MATCH","actuate - T1 auto, T2 cooldown, T3 human-queue, T4 rejected, re-derived from the ACTION so a caller cannot promote its own request; params whitelisted, a missing target is invalid not guessed","concept - a manthan or di dossier Prototype Plan becomes a dimensioned STEP fixture, so an innovation run ships something a machine shop can quote instead of only concept art","facts and view - raw topology, and a CAD Viewer link for STEP, GCODE, URDF and DXF"],"with":["figcheck","manthan","honesty","design"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"exploded-view","name":"exploded-view \u2014 single-scalar ine coverage and REFUSE when the text does not match the audio"],"with":["videorecap","voxa","vachan","audiobookforge","parakeet-dict"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"pahra","name":"pahra \u2014 local AI eyes on camera footage","hall":"studio","group":"Visual & creative","cat":"media video","what":"local AI eyes on camera footage: VLM event narration (qwen3-vl:30b, abstain-gated so empty scenes stay silent) + semantic footage search (VLM-caption then embed, no CLIP) + a Qubo/cloud-cam bridge via iPhone Mirroring with a private 'Qubo cam' Telegram channel and hourly AI-event push","mode":"On demand","kind":"cli","host":"This Mac","in":["a camera frame/video, or a live Qubo cam via the mirrored iPhone"],"out":["one-line event narration (+image) routed to Telegram; or ranked footage-search hits"],"can":["narrate a camera frame/burst into one abstain-gated event sentence","semantic search over recorded footage (VLM caption + nomic-embed, no CLIP)","bridge a cloud-only Qubo cam via iPhone Mirroring (open live view, crop, narrate)","read Qubo's OWN AI-detected event thumbnails and push new ones","push summary+image to a private 'Qubo cam' Telegram channel","run hourly via LaunchAgent com.king.qubo-hourly (needs phone mirrored + Qubo open)","detect a fall via a deterministic biomechanical FSM over pose keypoints (pahra fall) \u2014 fast descent + angular collapse + post-stillness, no training, CPU-only, every alert explainable; the cheap FSM gates the qwen3-vl narrator","escalate fall + no-recovery (still down past N sec) to the 'Qubo cam' Telegram channel \u2014 the medical event, distinct from a slip-and-recover","carry a pose track through furniture occlusion (Kalman velocity + bone-length clamp)"],"with":["iphone","fanout","abstain_gate","netra","nagrik"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"primer","name":"Primer Explainer-Video Vault","hall":"studio","group":"Visua ctory module"],"out":["textured .glb, procedural Three.js TypeScript, a self-contained interactive viewer HTML, orbit PNGs, JSON verdicts"],"can":["photo -> photoreal textured 3D mesh (.glb) via image-to-3D, ~4 min","photo -> procedural code-only Three.js model (editable, no textures)","interactive 360 viewer: orbit, zoom, pan, auto-rotate, exposure, environment","explode a model 0-100% and reassemble it, with the camera dollying to keep it framed","isolate or hide any individual part; wireframe; PNG snapshot","download the model as .glb for Blender / Unity / any engine","cut a fused generated mesh into explodable named parts (spatial clustering)","orbit-render any Three.js page from N camera angles (real WebGL via playwright)","catch a FAKE 3D object: a flat billboard collapses to silhouette area 0.0000 edge-on","score a render against its reference with zero-token deterministic pixel math"],"with":["xgen","rmbg","imgrank","durbar","live-map","teleport-app","design","frontier-gate"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"bhor","name":"Bhor Nightly Muse Gallery","hall":"studio","group":"Visual & creative","cat":"media/automation","what":"Autonomous nightly creative-image gallery. Reads the user's world (wiki hot.md + recent memory) + a 7-night theme calendar -> Ollama writes ~12 image prompts (themed + creative-escape) -> model-ab --auto draws each -> imgrank features top 3 -> mobile HTML gallery (click-to-enlarge lightbox) + contact sheet + manifest. Delivers to Telegram + opens HTML. First RIGHT-brain item in the morning ritual.","mode":"Service","kind":"cli","host":"This Mac","in":["none"],"out":["image/png","html","json"],"can":["muse-gallery","nightly-art","morning-inspiration","creative-images-overnight","dawn-gallery","daily-art-feed","inspire-creativity"],"with":["model-ab","imgrank","xgen"],"cmd":"","url":"","state":"responding","stateLabel":"Responding","stateNote":""},{"id":"jigyasa","name":"Jigyasa Serendipi ign","what":"Generate AI images where the text lives INSIDE the art \u2014 comic/webtoon speech bubbles, CJK lettering, stickers, memes, a single PNG with no HTML wrapper. The counterpart to image-plate-composite (which layers HTML text OVER a clean plate). Guards both failure modes: garbled glyphs AND overlay-look (spelling-correct text in a clean digital font laid flat reads as pasted-on and breaks immersion \u2192 regen). Provides a bake prompt recipe (short quoted text + \"hand-lettered in the same ink as the artwork, integrated into the drawing\" + negative \"no typeset overlay text\"), an overlay-look detector (mechanical stroke uniformity, ruler-perfect kerning, system-gothic look, over-smooth edges, separated black tone), and a QA discipline (census not batch-stamp, cross-comparison sweep, md5-dedup the parallel batch). Stolen from revfactory/webtoon-harness.","mode":"On demand","kind":"skill","host":"This Mac","in":[],"out":[],"can":["bake-text-into-image","text-in-image","comic-speech-bubble","webtoon-lettering","cjk-text-in-image","sticker-with-caption","meme-text","overlay-look-check","integrated-lettering"],"with":["design","xgen","imgrank"],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"durbar-observatory","name":"Durbar Observatory (3D-print CAD)","hall":"studio","group":"Visual & creative","cat":"media/design","what":"3D-printable palace + orrery with an opening six-petal dome (build123d); STL/STEP/GLB outputs, browser CAD viewer and assembly guide.","mode":"Service","kind":"http","host":"This Mac","in":["none (open the viewer)"],"out":["build/assembly.glb, build/durbar-observatory.zip, docs/assembly.html"],"can":["cad-model","3d-print-package","assembly-viewer"],"with":[],"cmd":"","url":"","state":"degraded","stateLabel":"Degraded","stateNote":""},{"id":"kiln-assets","name":"Kiln Assets (text to validated GLB)","hall":"studio","group":"Visual & creative","cat":"media/design","what":"Turn a text prompt into a par  creative","cat":"media/production","what":"Stream prober + IPTV playlist curator (tool-eval-iptv-api SKIP\u2192override\u2192BUILT). Realizes the Guovin/iptv-api paradigm headless: collect M3U/txt sources \u2192 two-layer probe (ffprobe decode + stability-window early-exit throughput, probe.py importable) \u2192 resolution-aware quality gate \u2192 rank \u2192 emit clean M3U. Supercharged: discover=freeintel web-search, categorize=fusion-shim :8051 local LLM group-titles, deliver=tg-send+Obsidian, schedule=LaunchAgent daily 07:45 refresh, injection-scan untrusted channel names. Consumes only publicly-listed FTA sources (iptv-org). Subcmds: probe/curate/discover/categorize/refresh/monitor/presets. a local folder, a local folder state.","mode":"Scheduled task","kind":"cli","host":"This Mac","in":["see description"],"out":["see description"],"can":["iptv","m3u","playlist","live tv","stream alive","is this stream working","curate playlist","india tv channels","free tv streams","probe stream"],"with":[],"cmd":"","url":"","state":"unknown","stateLabel":"Unverified","stateNote":""},{"id":"videorecap","name":"videorecap CLI","hall":"studio","group":"Visual & creative","cat":"media/production","what":"Local-first video RECAP (jieshuo / \u89e3\u8bf4) pipeline (tool-eval-video-recap-skills STEAL->BUILT). Turns an EXISTING video into a narrated recap - the INVERSE of the stack's video-CREATION tools (freevideo/xplain/news2video). 10 stages: probe -> ffmpeg scene-detect -> whisper ASR -> qwen3-vl:30b per-scene frame captions -> timeline-fusion 'understanding' object -> fusion-shim :8051 recap-script + self-review -> MOSS-TTS :8198 voiceover -> cut-first render (atempo-fit keeps voice locked to picture) -> ffmpeg assemble (duck original + burn subtitles) -> CapCut/JianYing draft_content.json export. 100% on-device: ported the architecture from worldwonderer/video-recap-skills but replaced its Xiaomi-MiMo cloud (which received your frames) with local whisper+ollama+MOSS-TTS. Untrusted ASR/caption text is fed to the LLM as DATA, never instructions. --condense N keeps only the N richest scenes; --doctor checks deps. Engine tools/videorecap/, launcher a local folder, state a local folder","mode":"On demand","kind":"cli","host":"This Mac","in":["video file path or URL"],"out":["narrated recap.mp4 + CapCut draft_content.json + understanding.json"],"can":["recap this video","summarize this video","narrate this video","video recap","jieshuo","explain this clip","condense this video","voiceover for this video","digest this lecture video"],"with":[],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"vwatch","name":"vwatch CLI","hall":"studio","group":"Visual & creative","cat":"media/production","what":"Let Claude WATCH a video with its own eyes (bradautomates/claude-video /watch STEAL->BUILT). The third mode of the local video stack: CREATE (freevideo/xplain), RECAP (videorecap, a LOCAL model watches + makes an artifact), and WATCH (this - frames + transcript go into CLAUDE's OWN multimodal context for ad-hoc Q&A, no artifact). Given a video URL/file + a question: yt-dlp/local acquire -> sample frames by a token-budgeted detail tier (efficient/balanced/token-burner) -> MAD frame-dedup drops held-slide/static frames -> caption-first transcript (free yt-dlp subs, then LOCAL whisper fallback) -> prints a manifest of timestamped frame paths + transcript for Claude to Read and answer grounded in what's on screen. Reuses videorecap's helpers; NO cloud Whisper. Untrusted transcript fed as DATA, never instructions. Named vwatch (homebrew `watch` shadows). Engine tools/watch/, launcher a local folder, state a local folder","mode":"On demand","kind":"cli","host":"This Mac","in":["video file path or URL + a question"],"out":["manifest of timestamped frame paths + transcript for Claude to Read"],"can":["watch this video","what happens at this timestamp","what is on screen in this video","ask a question about a video","what doe m","generate images and send to telegram","image production run"],"with":["xgen","genie","design"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"sambandh","name":"sambandh","hall":"studio","group":"Visual & creative","cat":"vision","what":"Open-vocabulary relation edges between image regions \u2014 the scene-graph EDGES (person->carrying->bag) our detectors (nodes) don't produce. Torch-free ONNX, CPU, class-agnostic: brings its own boxes from any detector.","mode":"On demand","kind":"cli","host":"This Mac","in":["image + boxes (xyxy) [+ labels/scores] [+ predicate list]"],"out":["relation edges (subject -predicate[score]-> object), JSON/text/overlay"],"can":["relate","predicates","scene-graph overlay","qubo structured camera events","vahan relational inspection","netra change-in-relation"],"with":["supervision-vision","qubo","pahra","vahan","netra","diagen"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"live-map","name":"live-map skill (map artifacts)","hall":"studio","group":"Visual & creative","cat":"visual/maps","what":"Builds single self-contained HTML map artifacts (light mode, no CDNs). Three paradigms: (1) transit-network live simulator - trains as pure function of wall clock; (2) route atlas - roads classed nh/sh/dr/track with per-segment km, fuel/permit nodes, GPS live YOU-dot (watchPosition) and multi-rider ride rooms over ntfy.sh (fetch POST publish + EventSource since=12h replay = late joiners get last-known dots; invite link ?ride=<code> is the access key); (3) OSM trail atlas - Overpass fetch of ALL highways+paths in a radius (UA header, around: query), Douglas-Peucker simplify per-class, canvas engine w/ per-class cached Path2D in world-km coords (20k ways smooth on phone), bbox-prefiltered hover hit-test, tap-to-measure ruler, viewpoint/peak/fuel POIs. Deploy: GitHub Pages via git -C (never cd), verify SHA-256 served==local. Templates a local folder; pipeline example kpg_fetch.py/kpg_process.py pattern. (4) intervisibility atlas - real DEM relief base (AWS Terrain Tiles) + bespoke 2D line-of-sight engine: peak-to-peak / drop-an-observer-dot / viewshed modes, curvature+refraction (k=0.13) LOS raycast with terrain cross-section, radial viewshed overlay, and Relief/Map/Satellite layer toggle (ESRI+Carto tiles align to the DEM z-tile grid pixel-exact). Shipped: dtensor.github.io/metro-live, dtensor.github.io/sikkim-bike-map (+ /kalimpong.html trail atlas), dtensor.github.io/sikkim-los-atlas (intervisibility, Kalimpong->China border, 367 peaks). (5) streetview-teleport (StadiView paradigm clean-roomed 2026-07-21) - OSM building massing extruded in raw WebGL, orbit -> click marker -> cinematic fly-down to 1.7m first-person street view; optional REAL Mapillary panoramas cross-fade on arrival (--mapillary-token, token a local folder, API needs 3x3 bbox tiling in dense cities); optional --terrain drapes scene on real SRTM z14 (roads climb, buildings skirt slopes, HUD shows m ASL). Overpass fetch has 3-mirror fallback. Check Mapillary coverage first: Kalimpong=0, Darjeeling/Siliguri/Tokyo=good. templates/streetview-teleport/ (fetch_data.py -> build.py).","mode":"On demand","kind":"skill","host":"This Mac","in":["place/region or network name; optional radius; optional real-OSM-data mode"],"out":["one self-contained HTML file, optionally deployed to GitHub Pages"],"can":["road atlas","bike map","trail map","cycling and walking map","map with distances","live location on a map","share locations with friends on one map","ride room","metro live map","transit simulator"],"with":[],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"vajra-defence-cockpit","name":"VAJRA \u2014 Defence Query Cockpit + Entity Intelligence","hall":"watch","group":"Defence & intelligence","cat":"defense/intelligence","what":"Natural-language front door over the whole defence stack that fans one query across the local tender DB, extracted head and a post, pulls real SRTM elevation (AWS Terrarium, cached, curl fallback), treats DENSITY ALTITUDE (h + 120*ISA offset) as a first-class routing cost, runs Dijkstra with ceiling/climb/energy/headwind rules across regimes (isa, hot-afternoon, winter-dawn, storm) and PUBLISHES the refusal set with reasons. Any tile failure is DEGRADED, never 'impassable'. Phase 2 `envelope.py rescore` re-runs a record under an aircraft envelope whose every field states measured|declared|assumed provenance and reports which verdicts FLIP; worst provenance is printed, never averaged; a degraded run reports zero flips.","mode":"On demand","kind":"bash","host":"This Mac","in":["road-head + post lat/lon, regime names, envelope JSON (Phase 2)"],"out":["<out>.json {corridors, refusals, regime, degraded, inputs} + <out>.svg; rescore JSON with flips"],"can":["route a resupply corridor on real terrain with density altitude as the cost","refuse, with a stated reason, when the air will not hold the aircraft","rescore a stored corridor under a real aircraft envelope and list verdict flips","produce a light-theme SVG map + JSON record naming every input"],"with":["samar (MED-UNMANNED lane)","labbench","netra/parikrama terrain","manthan dossier"],"cmd":"","url":"","state":"on_demand","stateLabel":"On demand","stateNote":""},{"id":"atlasforge","name":"atlasforge \u2014 Wikidata class \u2192 explorable knowledge atlas (castlemap factory)","hall":"watch","group":"Defence & intelligence","cat":"domain intelligence","what":"atlasforge: the thecastlemap.com recipe as a factory. One Wikidata class (forts, lighthouses, battles, observatories...) + a country -> curated knowledge atlas: items need coordinates AND a Wikipedia article in any of 13 Indian/English editions (photo optional, badged); fame = rank-product of sitelinks x last-year pageviews so high-on-one-signal never reaches 100; state by point-in-polygon with flagged coastal snap; hand-picked routes resolved by name (a miss is reported, neve   for(const h of hits){if(h.object===hitMesh){const e=EX[h.instanceId];if(e&&e.g.visible)return{e,pt:h.point};continue;}if(FLOORS.includes(h.object))return{floor:h.point};return{};}
  return{};
}
const tip=$('#tip');
function hover(ev){
  const p=pick(ev.clientX,ev.clientY);canvas.classList.toggle('hot',!!p.e);
  if(p.e){cursor.visible=false;const r=stage.getBoundingClientRect();tip.hidden=false;tip.style.left=(ev.clientX-r.left)+'px';tip.style.top=(ev.clientY-r.top)+'px';tip.style.setProperty('--c',stCol(p.e.state));tip.innerHTML=`<i></i>${esc(p.e.name)}`;}
  else{tip.hidden=true;if(p.floor){const[x,z]=resolve(p.floor.x,p.floor.z);cursor.position.set(x,.03,z);cursor.visible=true;}else cursor.visible=false;}
}
canvas.addEventListener('pointerdown',ev=>{if(ev.button>0)return;interrupt();dragging={x:ev.clientX,y:ev.clientY,moved:0,lx:ev.clientX,ly:ev.clientY,t:performance.now()};canvas.setPointerCapture(ev.pointerId);});
canvas.addEventListener('pointermove',ev=>{
  if(dragging){const dx=ev.clientX-dragging.lx,dy=ev.clientY-dragging.ly;dragging.lx=ev.clientX;dragging.ly=ev.clientY;dragging.moved+=Math.abs(dx)+Math.abs(dy);
    if(dragging.moved>6){canvas.classList.add('drag');const k=.0042*fov/66;yaw+=dx*k;pitch+=dy*k;const now=performance.now(),dt=Math.max(8,now-dragging.t)/1000;dragging.t=now;yawV=dx*k/dt;pitchV=dy*k/dt;cursor.visible=false;tip.hidden=true;}}
  else if(ev.pointerType==='mouse')hover(ev);
});
canvas.addEventListener('pointerup',ev=>{
  const d=dragging;dragging=null;canvas.classList.remove('drag');if(!d)return;
  if(performance.now()-d.t>120){yawV=0;pitchV=0;}
  if(d.moved<=6){yawV=pitchV=0;const p=pick(ev.clientX,ev.clientY);if(p.e)visit(p.e);else if(p.floor)glideTo(p.floor.x,p.floor.z);}
});
canvas.addEventListener('pointerleave',()=>{cursor.visible=false;tip.hidden=true;});
canvas.addEventListener('wheel',ev=>{ev.preventDefault();fovT=Math.max(38,Math.min(80,fovT+ev.deltaY*.03));},{passive:false});
addEventListener('keydown',ev=>{
  if(ev.target.closest('input,textarea'))return;const k=ev.key.toLowerCase();
  if(['w','a','s','d','q','e','arrowup','arrowdown','arrowleft','arrowright','shift'].includes(k)){keys.add(k);interrupt();if(k.startsWith('arrow'))ev.preventDefault();}
  else if(k==='n'||k===']')nextEx(1);else if(k==='p'||k==='[')nextEx(-1);else if(k==='escape')closeDrawer();else if(k==='/'){ev.preventDefault();$('#q').focus();}
});
addEventListener('keyup',ev=>keys.delete(ev.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;
  if(k==='next'||k==='prev')b.addEventListener('click',()=>nextEx(k==='next'?1:-1));
  else{b.addEventListener('pointerdown',ev=>{ev.preventDefault();interrupt();keys.add(k);});['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>keys.delete(k)));}});
function nextEx(dir){
  const z=zoneAt(pos.x,pos.z);let list=z.h?z.h.ex:HALLS[0].ex;
  let cur=focus&&focus.h===(z.h||focus.h)?focus.idx:-1;
  if(cur<0){let best=1e9;list.forEach((e,i)=>{const d=Math.hypot(e.x-pos.x,e.z-pos.z);if(d<best){best=d;cur=i-(dir>0?1:0);}});if(!z.h)cur=dir>0?-1:0;}
  const i=((cur+dir)%list.length+list.length)%list.length;visit(list[i]);
}
let hintGone=false;function hideHint(){if(hintGone)return;hintGone=true;setTimeout(()=>$('#hint').style.opacity=0,2500);}
if(matchMedia('(pointer:coarse)').matches)$('#hint').textContent='Drag to look · tap the floor to walk · tap an exhibit';

// ---------------------------------------------------------------- drawer
const drawer=$('#drawer');
function launchHtml(e){
  let h='<div class="launch">';
  if(e.url)h+=`<div class="btnrow"><a class="primary" href="${esc(e.url)}" target="_blank" rel="noopener">Open ${esc(e.name.split(/[\s(—-]/)[0]||'app')} ↗</a></div><p class="fine">Opens ${esc(e.url.replace(/^https?:\/\//,''))}. This works on the owner's Mac or tailnet.</p>`;
  if(e.cmd)h+=`<div><div class="sec"><h3>${e.url?'Or run it':'Launch it'}</h3></div><pre class="cmd" id="cmd">${esc(e.cmd)}</pre><div class="btnrow" style="margin-top:8px"><button class="ghost" id="copy">Copy command</button>${DATA.explorer?`<a class="ghost" href="${esc(DATA.explorer)}&amp;app=${encodeURIComponent(e.id)}" target="_blank" rel="noopener">Open in estate explorer ↗</a>`:''}</div></div>`;
  else if(DATA.explorer)h+=`<div class="btnrow"><a class="ghost" href="${esc(DATA.explorer)}&amp;app=${encodeURIComponent(e.id)}" target="_blank" rel="noopener">Open in estate explorer ↗</a></div>`;
  else if(DATA.web)h+=`<p class="fine">This is the public showcase. Launch links and commands live on the owner's private copy.</p>`;
  return h+'</div>';
}
function openDrawer(e){
  focus=e;const h=e.h,s=STATE[e.state]||STATE.unknown;
  const ports=(list,cls)=>list.length?list.map(t=>`<span class="port" style="--p:${portCol(t)}">${esc(t)}</span>`).join(''):`<span class="port" style="--p:#8a8f98">—</span>`;
  const withs=e.with.map(id=>{const o=byId.get(id);return o?`<button class="chip" data-go="${esc(id)}" style="--c:${o.h.col}"><i></i>${esc(o.name)}</button>`:`<span class="chip">${esc(id)}</span>`;}).join('');
  drawer.style.setProperty('--c',h.col);
  drawer.innerHTML=`<button class="close" aria-label="Close">✕</button>
  <div class="ey">${esc(h.name)} · ${esc(e.cat||e.group)}</div><h2>${esc(e.name)}</h2>
  <span class="pill${e.state==='responding'?' live':''}" style="--s:${s[0]}"><i></i>${esc(s[1])}</span>
  ${e.stateNote?`<p class="statenote">${esc(e.stateNote)}</p>`:''}
  <p class="what">${esc(e.what||'No description in the catalogue yet.')}</p>
  <div class="sec"><h3>How it works</h3><div class="machine"><div class="col">${ports(e.in)}</div><div class="core">${esc(e.mode||e.kind||'tool')}</div><div class="col r">${ports(e.out)}</div></div></div>
  ${e.can.length?`<div class="sec"><h3>Can do</h3><div class="chips">${e.can.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div></div>`:''}
  ${withs?`<div class="sec"><h3>Works with</h3><div class="chips">${withs}</div></div>`:''}
  ${launchHtml(e)}
  <div class="walk"><button class="ghost" data-step="-1">‹ Previous</button><button class="ghost" data-step="1">Next exhibit ›</button></div>`;
  drawer.hidden=false;
  drawer.querySelector('.close').onclick=closeDrawer;
  drawer.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{showView('3d');visit(byId.get(b.dataset.go));});
  drawer.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>nextEx(+b.dataset.step));
  const cp=drawer.querySelector('#copy');if(cp)cp.onclick=()=>{const t=e.cmd;navigator.clipboard?.writeText(t).then(()=>cp.textContent='Copied',()=>{selectCmd();cp.textContent='Selected: press ⌘C';}) ?? (selectCmd(),cp.textContent='Selected: press ⌘C');};
  showBeams(e);
}
function selectCmd(){const el=$('#cmd');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}
function closeDrawer(){drawer.hidden=true;focus=null;clearBeams();}
function clearBeams(){if(beams){beams.traverse(o=>o.geometry&&o.geometry.dispose());scene.remove(beams);beams=null;}}
function showBeams(e){
  clearBeams();const g=new THREE.Group();
  e.with.forEach(id=>{const o=byId.get(id);if(!o||o===e)return;const a=new THREE.Vector3(e.x,2.3,e.z),b=new THREE.Vector3(o.x,2.3,o.z);const m=a.clone().lerp(b,.5);m.y=Math.min(HH-.4,2.8+a.distanceTo(b)*.2);
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(new THREE.QuadraticBezierCurve3(a,m,b).getPoints(60)),MAT.beam));});
  g.renderOrder=5;scene.add(g);beams=g;
}

// ---------------------------------------------------------------- search + catalogue
const qi=$('#q'),res=$('#results');
function matches(q){q=q.trim().toLowerCase();if(!q)return[];return EX.map(e=>{const n=e.name.toLowerCase();let s=n.startsWith(q)?3:n.includes(q)?2:(e.id+' '+e.what+' '+e.can.join(' ')+' '+e.cat).toLowerCase().includes(q)?1:0;return[s,e];}).filter(x=>x[0]).sort((a,b)=>b[0]-a[0]||a[1].name.localeCompare(b[1].name)).map(x=>x[1]);}
qi.addEventListener('input',()=>{const m=matches(qi.value).slice(0,8);res.hidden=!m.length;res.innerHTML=m.map(e=>`<button role="option" data-id="${esc(e.id)}" style="--c:${e.h.col}"><i></i><b>${esc(e.name)}</b><small>${esc(e.h.name)} · ${esc(e.what)}</small></button>`).join('');if(!$('#catalogue').hidden)renderCat();});
res.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;res.hidden=true;qi.blur();showView('3d');visit(byId.get(b.dataset.id));});
qi.addEventListener('keydown',ev=>{if(ev.key==='Enter'){const f=res.querySelector('button');f&&f.click();}if(ev.key==='Escape'){res.hidden=true;qi.blur();}});
document.addEventListener('click',ev=>{if(!ev.target.closest('.search'))res.hidden=true;});
let filt='all';
const FILTERS=[['all','All apps',()=>true],['live','Running now',e=>e.state==='responding'],['ondemand','On demand',e=>e.state==='on_demand'],...(DATA.web?[]:[['open','Opens in a browser',e=>!!e.url]]),['attn','Needs attention',e=>['stopped','degraded','conflict','unreachable','auth_required'].includes(e.state)]];
function renderCat(){
  const c=$('#catalogue'),q=qi.value.trim().toLowerCase(),f=FILTERS.find(x=>x[0]===filt)[2];
  const pass=e=>f(e)&&(!q||(e.name+' '+e.id+' '+e.what+' '+e.can.join(' ')+' '+e.cat).toLowerCase().includes(q));
  let html=`<div class="cwrap"><div class="filters" role="group" aria-label="Filter">${FILTERS.map(([id,l,fn])=>`<button data-f="${id}" aria-pressed="${id===filt}">${l} <span style="opacity:.6">${EX.filter(fn).length}</span></button>`).join('')}</div>`;let any=0;
  HALLS.forEach(h=>{const ex=h.ex.filter(pass);if(!ex.length)return;any+=ex.length;
    html+=`<div class="chall" style="--c:${h.col}"><h2>${esc(h.name)}</h2><span>${ex.length} of ${h.ex.length} · ${esc(h.blurb)}</span></div><div class="cards">`+ex.map(e=>{const s=STATE[e.state]||STATE.unknown;return`<article class="card"><div class="top"><div><div class="cat">${esc(e.cat||e.group)}</div><h4>${esc(e.name)}</h4></div><span class="dot" style="--s:${s[0]}" title="${esc(s[1])}"></span></div><p>${esc(e.what)}</p><div class="btnrow">${e.url?`<a class="primary" href="${esc(e.url)}" target="_blank" rel="noopener">Open ↗</a>`:''}<button class="ghost" data-visit="${esc(e.id)}">See exhibit</button></div></article>`;}).join('')+'</div>';});
  if(!any)html+='<p class="empty">No apps match. Clear the search or pick another filter.</p>';
  c.innerHTML=html+'</div>';
  c.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filt=b.dataset.f;renderCat();});
  c.querySelectorAll('[data-visit]').forEach(b=>b.onclick=()=>{showView('3d');visit(byId.get(b.dataset.visit),{instant:true});});
}
let view='3d';
function showView(v){view=v;$('#v3d').setAttribute('aria-pressed',v==='3d');$('#vcat').setAttribute('aria-pressed',v==='cat');$('#catalogue').hidden=v!=='cat';if(v==='cat')renderCat();}
$('#v3d').onclick=()=>showView('3d');$('#vcat').onclick=()=>showView('cat');

// ---------------------------------------------------------------- minimap
const mini=$('#mini'),mctx=mini.getContext('2d');let plan=null,mScale=1;
function drawPlan(){
  const r=mini.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);mini.width=r.width*dpr;mini.height=r.height*dpr;
  const ext=HS+Math.max(...HALLS.map(h=>h.L))+2;mScale=(Math.min(mini.width,mini.height)/2-8*dpr)/ext;
  plan=document.createElement('canvas');plan.width=mini.width;plan.height=mini.height;const x=plan.getContext('2d');x.translate(mini.width/2,mini.height/2);x.scale(mScale,mScale);
  x.fillStyle='rgba(120,110,95,.25)';x.beginPath();x.arc(0,0,R0,0,7);x.fill();
  HALLS.forEach(h=>{x.save();x.rotate(h.phi);x.fillStyle='rgba(120,110,95,.22)';x.fillRect(R0-1,-CW,HS-R0+1,2*CW);x.fillStyle=mix(h.col,'#ffffff',.55)+'cc';x.fillRect(HS,-h.W,h.L,2*h.W);x.restore();
    x.fillStyle=h.col;h.ex.forEach(e=>{x.beginPath();x.arc(e.x,e.z,.55,0,7);x.fill();});});
}
function drawMini(){
  if(!plan)return;const W=mini.width,H=mini.height;mctx.clearRect(0,0,W,H);mctx.drawImage(plan,0,0);
  mctx.save();mctx.translate(W/2+pos.x*mScale,H/2+pos.z*mScale);mctx.rotate(-yaw);const s=Math.max(5,W/34);
  mctx.fillStyle='rgba(35,69,122,.18)';mctx.beginPath();mctx.moveTo(0,0);mctx.arc(0,0,s*3.2,-Math.PI/2-.6,-Math.PI/2+.6);mctx.fill();
  mctx.fillStyle='#23457a';mctx.beginPath();mctx.moveTo(0,-s);mctx.lineTo(s*.7,s*.7);mctx.lineTo(0,s*.35);mctx.lineTo(-s*.7,s*.7);mctx.closePath();mctx.fill();mctx.restore();
}
mini.addEventListener('click',ev=>{const r=mini.getBoundingClientRect(),dpr=mini.width/r.width;const wx=((ev.clientX-r.left)*dpr-mini.width/2)/mScale,wz=((ev.clientY-r.top)*dpr-mini.height/2)/mScale;interrupt();
  const z=zoneAt(wx,wz);teleport(wx,wz,z.h?faceYaw(z.h.d[0],z.h.d[1]):yaw,-.04);});

// ---------------------------------------------------------------- location readout
let lastZone='';
function updateWhere(){
  const z=zoneAt(pos.x,pos.z),key=z.k+(z.h?z.h.id:'');if(key===lastZone)return;lastZone=key;
  const w=$('#where');w.style.setProperty('--c',z.h?z.h.col:'#8c6a22');
  if(z.k==='hub'){$('#whereEy').textContent='Rotunda';$('#whereName').textContent='Yantra Sangrahalaya';$('#whereSub').textContent=`${HALLS.length} halls around you · ${EX.length} apps`;}
  else{$('#whereEy').textContent=z.k==='cor'?'Entering':`Hall ${z.h.k+1}`;$('#whereName').textContent=z.h.name;$('#whereSub').textContent=`${z.h.ex.length} apps · ${z.h.live} running now`;}
  hb.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.h===(z.h?z.h.id:'hub')));
}

// ---------------------------------------------------------------- loop
let R,frame=0,clock=new THREE.Clock(),nearList=[];
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(1,r.height);camera.updateProjectionMatrix();drawPlan();}
function lod(){
  const z=zoneAt(pos.x,pos.z),inHall=z.k==='hall'?z.h:null;let made=0;nearList=[];
  for(const e of EX){const d=Math.hypot(e.x-pos.x,e.z-pos.z);const vis=d<52&&(!inHall||e.h===inHall);e.g.visible=vis;const nr=vis&&d<21;e.near.visible=nr;
    if(nr&&d<17&&!e.txt&&made<4){ensureText(e);made++;}else if(e.txt&&(d>28||!vis))dropText(e);
    if(nr)nearList.push([d,e]);}
  nearList.sort((a,b)=>a[0]-b[0]);nearList=nearList.slice(0,34).map(x=>x[1]);if(focus&&!nearList.includes(focus))nearList.push(focus);
}
const pulse=new THREE.Color();
function loop(){
  requestAnimationFrame(loop);if(view==='cat'||document.hidden)return;
  const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
  if(intro){intro.t+=dt/intro.dur;const k=Math.min(1,intro.t),s=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;camY=intro.y0+(EYE-intro.y0)*s;pos.z=intro.z0+(9.2-intro.z0)*s;pitch=intro.p0+(-.04-intro.p0)*s;yaw=intro.w0*(1-s);if(k>=1){intro=null;camY=EYE;}}
  step(dt);
  if(frame%5===0)lod();if(frame%3===0)drawMini();if(frame%10===0)updateWhere();frame++;
  const sp=RM?.2:1;R.orb.rotation.y+=dt*.12*sp;R.rings.forEach((r,i)=>r.rotation.z+=dt*(.15+i*.07)*sp);R.halo.material.opacity=.6+Math.sin(t*1.4)*.1;
  for(const e of nearList){const c=e.core,u=c.userData;c.position.y=1.9+(RM?0:Math.sin(t*1.3+e.seed*6)*.04);if(u.spin){c.rotation.y+=dt*u.spin[0]*sp;c.rotation.x+=dt*u.spin[1]*sp;}if(u.hand)u.hand.rotation.y-=dt*1.4*sp;if(e.beads)e.beads.rotation.y+=dt*.5*sp;}
  SMAT.responding.color.set(STATE.responding[0]);
  // running exhibits breathe
  if(frame%2===0){const k=.55+.45*Math.sin(t*2.6);pulse.set(STATE.responding[0]).lerp(new THREE.Color('#bff5d3'),k*.6);EX.forEach((e,i)=>{if(e.state==='responding')bandMesh.setColorAt(i,pulse);});bandMesh.instanceColor.needsUpdate=true;}
  if(beams)MAT.beam.opacity=.45+.25*Math.sin(t*3);
  updateParticles(nearList,t);
  cursor.material.opacity=.4+.2*Math.sin(t*4);
  renderer.render(scene,camera);
}

// ---------------------------------------------------------------- boot
async function boot(){
  try{await Promise.race([Promise.all(["46px Marcellus","19px 'Instrument Sans'","16px 'JetBrains Mono'"].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))]);}catch(_){}
  R=buildRotunda();HALLS.forEach(buildHall);buildExhibits();
    resize();addEventListener('resize',resize);
  if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
  const deep=decodeURIComponent(location.hash.slice(1));const target=byId.get(deep);
  if(target){[pos.x,pos.z]=resolve(target.vx,target.vz);yaw=faceYaw(target.x-target.vx,target.z-target.vz);openDrawer(target);}
  else if(!RM)intro={t:0,dur:3.2,y0:8.2,z0:10.6,p0:-.42,w0:.5};
  window.__yantra={pos,zone:()=>zoneAt(pos.x,pos.z).k};
  lod();updateWhere();loop();
  const v=$('#veil');v.style.opacity=0;setTimeout(()=>v.hidden=true,800);
}
boot();
})();
